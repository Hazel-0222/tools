<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
// 主题预载（防闪烁）：与首页共用 localStorage['ui-theme']
(function () {
    try {
        var t = localStorage.getItem('ui-theme');
        if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>图片拼图 · 网格/长图拼接</title>
<style>
:root {
    /* ── 与工具合集首页保持一致的设计 Token ── */
    --bg: #eef0fb;
    --page-bg-image:
        radial-gradient(900px 520px at 10% -10%, rgba(0,113,227,.145), transparent 60%),
        radial-gradient(760px 480px at 90% 0%, rgba(122,92,255,.125), transparent 60%),
        radial-gradient(840px 560px at 50% 108%, rgba(255,154,186,.105), transparent 60%),
        linear-gradient(165deg, #e7ecfb 0%, #eee9fc 55%, #f6ecf2 100%);
    --card-bg: #ffffff;
    --input-bg: rgba(255,255,255,0.85);
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --border: #e2e2e7;
    --primary: #0071e3;
    --primary-soft: #e8f2fe;
    --focus-ring: rgba(0,113,227,0.22);
    --hover-bg: rgba(0,0,0,0.045);
    --success: #34a853;
    --success-soft: rgba(52,168,83,0.16);
    --danger: #e53935;
    --btn-bg: #0071e3;
    --btn-fg: #ffffff;
    --btn2-bg: #e5e5ea;
    --btn2-fg: #1d1d1f;
    --btn-shadow:
        0 1px 2px rgba(0,0,0,0.14),
        0 3px 10px -1px rgba(13,25,60,0.16);
    --btn-shadow-hover:
        0 2px 4px rgba(0,0,0,0.16),
        0 6px 18px -2px rgba(13,25,60,0.24);
    --log-info: #0071e3;
    --log-success: #1a7f37;
    --log-error: #d93025;
    --log-warn: #9a6700;
    --hd-veil: rgba(255,255,255,0.65);
    --panel-shadow:
        0 2px 8px rgba(13,25,60,0.04),
        0 24px 56px -16px rgba(13,25,60,0.14);
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-hover: 0 8px 24px rgba(0,0,0,0.12);
    --mono: "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
}
[data-theme="dark"] {
    --bg: #0f1016;
    --page-bg-image:
        radial-gradient(900px 520px at 10% -10%, rgba(80,140,255,.13), transparent 60%),
        radial-gradient(760px 480px at 90% 0%, rgba(139,124,255,.10), transparent 60%),
        radial-gradient(840px 560px at 50% 108%, rgba(255,140,180,.06), transparent 60%),
        linear-gradient(165deg, #12131f 0%, #0f0f1a 55%, #150f1b 100%);
    --card-bg: #1a1b22;
    --input-bg: #14151c;
    --text: #ededf1;
    --text-secondary: #9a9ba5;
    --border: #2a2b33;
    --primary: #5ea2f5;
    --primary-soft: rgba(94,162,245,0.16);
    --focus-ring: rgba(94,162,245,0.30);
    --hover-bg: rgba(255,255,255,0.06);
    --success: #4caf7d;
    --success-soft: rgba(76,175,125,0.20);
    --danger: #f0716a;
    --btn-bg: #5ea2f5;
    --btn-fg: #1d1d1f;
    --btn2-bg: rgba(229,229,234,0.14);
    --btn2-fg: #ededf1;
    --btn-shadow:
        0 1px 2px rgba(0,0,0,0.4),
        0 4px 14px -2px rgba(0,0,0,0.5);
    --btn-shadow-hover:
        0 2px 4px rgba(0,0,0,0.45),
        0 8px 22px -2px rgba(0,0,0,0.6);
    --log-info: #4fc3f7;
    --log-success: #81c784;
    --log-error: #ef5350;
    --log-warn: #ffb74d;
    --hd-veil: rgba(255,255,255,0.05);
    --panel-shadow:
        0 8px 20px rgba(0,0,0,0.34),
        0 32px 64px -16px rgba(0,0,0,0.42);
    --shadow: 0 1px 2px rgba(0,0,0,0.5);
    --shadow-hover: 0 8px 24px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    background-image: var(--page-bg-image);
    background-attachment: fixed;
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 36px 20px 60px;
    transition: background-color 0.3s, color 0.3s;
}
.page { max-width: 820px; margin: 0 auto; }

/* ── 顶栏：返回链接 + 主题切换 ── */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}
.back-link {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 6px 10px 6px 0;
    transition: color 0.15s;
}
.back-link:hover { color: var(--primary); }
.theme-toggle {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--input-bg);
    font-size: 16px; cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
}
.theme-toggle:hover { transform: scale(1.08); }

/* ── 面板 ── */
.panel {
    --panel-pad: 32px;
    --panel-r: 18px;
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: var(--panel-shadow);
    padding: var(--panel-pad);
}
.panel .hd {
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 0;
    padding-bottom: 14px;
    margin-bottom: 18px;
}
.panel .hd::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: calc(-1 * var(--panel-pad));
    left: calc(-1 * var(--panel-pad));
    right: calc(-1 * var(--panel-pad));
    bottom: 0;
    background:
        linear-gradient(var(--hd-veil), var(--hd-veil)),
        var(--page-bg-image);
    border-radius: var(--panel-r) var(--panel-r) 0 0;
}
.panel .hd .ico { font-size: 34px; line-height: 1; flex-shrink: 0; }
.panel .hd .hdtext { min-width: 0; }
.panel h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.3px;
}
.panel .subtitle {
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 3px;
    line-height: 1.55;
}

/* ── 拖拽区 ── */
.drop-zone {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1.5px dashed var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
    background: var(--input-bg);
    margin-bottom: 12px;
    user-select: none;
}
.drop-zone:hover,
.drop-zone.drag-over {
    border-color: var(--primary);
    background: var(--primary-soft);
    box-shadow: 0 0 0 4px var(--focus-ring);
}
.drop-zone .icon { font-size: 36px; line-height: 1; flex-shrink: 0; }
.drop-zone .dtxt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.drop-zone .title { font-size: 14px; font-weight: 500; }
.drop-zone .hint { font-size: 12px; color: var(--text-secondary); }

/* ── 粘贴模式提示条 ── */
.paste-hint {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--primary-soft);
    border: 1px solid var(--focus-ring);
    border-radius: 12px;
    padding: 10px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.paste-hint:hover {
    background: linear-gradient(var(--hover-bg), var(--hover-bg)), var(--primary-soft);
}
.paste-hint.active {
    background: var(--success-soft);
    border-color: var(--success);
    box-shadow: 0 0 0 3px var(--success-soft);
}
.paste-hint .ph-icon { font-size: 24px; line-height: 1; flex-shrink: 0; }
.paste-hint .ph-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
}
.paste-hint .ph-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
}
.paste-hint .status-text { font-size: 12px; color: var(--text-secondary); }
.paste-hint .exit-paste { margin-left: auto; flex-shrink: 0; color: var(--text-secondary); font-size: 12px; }

/* ── 文件列表 ── */
.file-list {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
    max-height: 200px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 12px;
    margin-bottom: 12px;
}
.file-item {
    display: flex;
    align-items: center;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: grab;
    transition: background 0.15s;
    margin: 2px 0;
}
.file-item:hover { background: var(--hover-bg); }
.file-item.dragging { opacity: 0.4; }
.file-item.drag-over { border-top: 2px solid var(--primary); }
.file-item .drag-handle { color: var(--text-secondary); margin-right: 8px; cursor: grab; font-size: 13px; flex-shrink: 0; }
.file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-item .btn-remove {
    background: none; border: none;
    color: var(--text-secondary);
    cursor: pointer; font-size: 13px;
    padding: 2px 6px; border-radius: 6px;
    margin-left: 4px; flex-shrink: 0;
}
.file-item .btn-remove:hover { color: var(--danger); background: var(--hover-bg); }

/* ── 模式选择 / 参数区 ── */
.mode-selector {
    background: var(--input-bg);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 12px;
    margin: 12px 0;
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
}
.mode-selector label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
}
.mode-selector .mode-hint { font-weight: 400; color: var(--text-secondary); }

.param-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    padding: 16px;
    border-radius: 12px;
    margin: 12px 0;
}
.param-item { flex: 1; min-width: 160px; }
.param-item label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
}
.param-item .label-dot {
    flex-shrink: 0;
    width: 6px; height: 6px;
    border-radius: 999px;
    background: var(--primary);
}
.param-item .sublabel { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
.param-item input[type="number"],
.param-item input[type="text"] {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    font-family: inherit;
    background: var(--card-bg);
    color: var(--text);
    outline: none;
    caret-color: var(--primary);
    transition: border-color 0.2s, box-shadow 0.2s;
}
.param-item input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--focus-ring);
}
.color-preview {
    display: inline-block;
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    vertical-align: middle;
    margin-left: 8px;
    flex-shrink: 0;
}

.option-row {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 13px;
    color: var(--text);
    margin: 0 0 12px;
    user-select: none;
}
.option-row .opt {
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
}
.option-row input { accent-color: var(--primary); }
.option-row .opt.disabled {
    color: var(--text-secondary);
    cursor: not-allowed;
}
.option-row .opt.disabled input { opacity: 0.5; }

/* ── 状态 / 进度 ── */
.status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    margin: 0 0 12px;
}
progress {
    -webkit-appearance: none;
    appearance: none;
    flex: 1; height: 6px;
    border: none;
    border-radius: 999px;
    background: var(--hover-bg);
}
progress::-webkit-progress-bar { background: var(--hover-bg); border-radius: 999px; }
progress::-webkit-progress-value { background: var(--primary); border-radius: 999px; }
progress::-moz-progress-bar { background: var(--primary); border-radius: 999px; }

/* ── 按钮 ── */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 18px;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    box-shadow: var(--btn-shadow);
    transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.1s;
    white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
    background: var(--btn-bg);
    color: var(--btn-fg);
}
.btn-primary:hover:not(:disabled) { box-shadow: var(--btn-shadow-hover); }
.btn-primary:disabled {
    background: var(--border);
    color: var(--text-secondary);
    cursor: not-allowed;
    box-shadow: none;
}
.btn-outline {
    background: var(--btn2-bg);
    color: var(--btn2-fg);
}
.btn-outline:hover:not(:disabled) {
    background: linear-gradient(var(--hover-bg), var(--hover-bg)), var(--btn2-bg);
    box-shadow: var(--btn-shadow-hover);
}
.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-row .btn { flex: 1; }

/* ── 日志 ── */
.log-area {
    background: var(--input-bg);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    max-height: 200px;
    overflow-y: auto;
    margin-top: 14px;
    min-height: 40px;
    border: 1px solid var(--border);
}
.log-area:empty::after { content: "等待操作…"; color: var(--text-secondary); }
.log-line { margin: 0; }
.log-line.info { color: var(--log-info); }
.log-line.success { color: var(--log-success); }
.log-line.error { color: var(--log-error); }
.log-line.warn { color: var(--log-warn); }

/* ── 页脚 ── */
.footer {
    text-align: center;
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
}

.hidden { display: none !important; }

/* ── 响应式 ── */
@media (max-width: 560px) {
    body { padding: 24px 14px 44px; }
    .panel { --panel-pad: 20px; --panel-r: 14px; }
}
</style>
</head>
<body>

<div class="page">
    <!-- 顶栏 -->
    <div class="topbar">
        <a class="back-link" href="../../index.html">← 返回工具集</a>
        <button class="theme-toggle" id="themeBtn" type="button" aria-label="切换明暗模式">🌙</button>
    </div>

    <!-- 主面板 -->
    <div class="panel">
        <div class="hd">
            <div class="ico">🖼️</div>
            <div class="hdtext">
                <h1>图片拼图 · 网格/长图拼接</h1>
                <p class="subtitle">留空 = 原图宽度 / 填值 = 统一宽度 · 可自定义背景 · 支持透明 PNG · 图片间带间隙 · 四周留白</p>
            </div>
        </div>

        <!-- 拖拽区 -->
        <div id="dropzone" class="drop-zone">
            <div class="icon">📁</div>
            <div class="dtxt">
                <div class="title">点击或拖拽图片到此区域（可多选，多次添加会累积）</div>
                <div class="hint">支持 JPG, PNG, WebP, BMP, GIF（透明 PNG 会合成背景色）</div>
            </div>
            <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/webp,image/bmp,image/gif" class="hidden">
        </div>

        <!-- 粘贴模式 -->
        <div id="pasteHint" class="paste-hint">
            <div class="ph-icon">📋</div>
            <div class="ph-text">
                <div class="ph-title">
                    <strong>点击这里激活粘贴模式</strong>
                    <span id="exitPasteBtn" class="exit-paste">✕ 退出</span>
                </div>
                <div class="status-text" id="pasteStatus">点击后按 Ctrl+V 粘贴截图，激活后一直有效直到退出</div>
            </div>
        </div>

        <!-- 文件列表 -->
        <div id="fileList" class="file-list hidden"></div>

        <!-- 模式选择 -->
        <div class="mode-selector">
            <label><input type="radio" name="mode" value="grid" checked> 网格拼图<span class="mode-hint">（自动排成接近正方形）</span></label>
            <label><input type="radio" name="mode" value="vertical"> 长拼图<span class="mode-hint">（垂直拼接成一长条）</span></label>
        </div>

        <!-- 参数 -->
        <div class="param-grid">
            <div class="param-item">
                <label><span class="label-dot"></span>单张图片宽度 (px)</label>
                <input type="number" id="imgWidth" value="" placeholder="留空=原图宽度" step="10" min="100">
                <div class="sublabel">留空则使用每张图片的原始宽度</div>
            </div>
            <div class="param-item">
                <label><span class="label-dot"></span>背景色</label>
                <div style="display:flex;align-items:center;width:100%">
                    <input type="text" id="bgColor" value="#FFFFFF" style="min-width:0;flex:1">
                    <span id="colorPreview" class="color-preview" style="background: #FFFFFF;"></span>
                </div>
            </div>
            <div class="param-item"><label><span class="label-dot"></span>图片间隙 (px)</label><input type="number" id="gap" value="10" min="0" step="2"></div>
            <div class="param-item"><label><span class="label-dot"></span>四周留白 (px)</label><input type="number" id="margin" value="20" min="0" step="5"></div>
        </div>

        <!-- 选项 -->
        <div class="option-row">
            <label class="opt"><input type="checkbox" id="showFilename"> 显示文件名</label>
            <label class="opt" id="ext-opt"><input type="checkbox" id="showExt"> 含后缀</label>
        </div>

        <!-- 状态 + 进度 -->
        <div class="status">
            <span>状态：</span>
            <span id="statusMsg">就绪</span>
            <progress id="progressBar" value="0" max="100" class="hidden"></progress>
        </div>

        <!-- 操作按钮 -->
        <div class="btn-row">
            <button id="processBtn" class="btn btn-primary" disabled>开始拼接</button>
            <button id="resetBtn" class="btn btn-outline">清空图片</button>
        </div>

        <!-- 日志 -->
        <div class="log-area" id="logArea"></div>

        <!-- 页脚 -->
        <div class="footer">图片将在浏览器中处理，不会上传服务器 · 拖拽文件列表的 ⋮⋮ 可调整顺序</div>
    </div>
</div>

<script>
(function () {
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileListDiv = document.getElementById('fileList');
    const imgWidthInput = document.getElementById('imgWidth');
    const showFilename = document.getElementById('showFilename');
    const showExt = document.getElementById('showExt');
    const extOpt = document.getElementById('ext-opt');
    const bgColorInput = document.getElementById('bgColor');
    const colorPreview = document.getElementById('colorPreview');
    const gapInput = document.getElementById('gap');
    const marginInput = document.getElementById('margin');
    const processBtn = document.getElementById('processBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusSpan = document.getElementById('statusMsg');
    const progressBar = document.getElementById('progressBar');
    const logArea = document.getElementById('logArea');
    const modeRadios = document.querySelectorAll('input[name="mode"]');
    const pasteHint = document.getElementById('pasteHint');
    const pasteStatus = document.getElementById('pasteStatus');
    const exitPasteBtn = document.getElementById('exitPasteBtn');
    const themeBtn = document.getElementById('themeBtn');

    let selectedFiles = [], processing = false, pasteModeActive = false, permissionGranted = false;

    // ── 明暗模式（与首页共用 localStorage['ui-theme']） ──
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
    themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        try { localStorage.setItem('ui-theme', next); } catch (e) {}
        applyTheme(next);
    });

    // ── 日志 / 状态 ──
    function addLog(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        const p = document.createElement('p');
        p.className = 'log-line ' + type;
        p.textContent = '[' + time + '] ' + msg;
        logArea.appendChild(p);
        logArea.scrollTop = logArea.scrollHeight;
    }
    function setStatus(text) { statusSpan.innerText = text; }

    // ====== 设置记忆 ======
    function saveSettings() {
        const s = {
            imgWidth: imgWidthInput.value,
            bgColor: bgColorInput.value,
            gap: gapInput.value,
            margin: marginInput.value,
            mode: getCurrentMode(),
            showFilename: showFilename.checked,
            showExt: showExt.checked
        };
        localStorage.setItem('imgStitch_settings', JSON.stringify(s));
    }
    function loadSettings() {
        try {
            const s = JSON.parse(localStorage.getItem('imgStitch_settings'));
            if (s) {
                if (s.imgWidth !== undefined) imgWidthInput.value = s.imgWidth;
                if (s.bgColor) { bgColorInput.value = s.bgColor; colorPreview.style.background = s.bgColor; }
                if (s.gap) gapInput.value = s.gap;
                if (s.margin) marginInput.value = s.margin;
                if (s.mode) modeRadios.forEach(r => { if (r.value === s.mode) r.checked = true; });
                if (s.showFilename !== undefined) showFilename.checked = s.showFilename;
                if (s.showExt !== undefined) showExt.checked = s.showExt;
            }
        } catch (e) {}
    }
    [imgWidthInput, bgColorInput, gapInput, marginInput].forEach(el => el.addEventListener('input', saveSettings));
    modeRadios.forEach(r => r.addEventListener('change', saveSettings));

    // 「显示文件名」未勾选时，「含后缀」自动禁用跟随
    function syncExtOption() {
        const on = showFilename.checked;
        extOpt.classList.toggle('disabled', !on);
        showExt.disabled = !on;
        if (!on) showExt.checked = false;
        saveSettings();
    }
    showFilename.addEventListener('change', syncExtOption);
    showExt.addEventListener('change', saveSettings);

    function getCurrentMode() {
        for (let radio of modeRadios) { if (radio.checked) return radio.value; }
        return 'grid';
    }

    // ====== 文件列表 + 拖拽排序 ======
    function updateFileListUI() {
        if (selectedFiles.length === 0) {
            fileListDiv.classList.add('hidden');
            processBtn.disabled = true;
            statusSpan.innerText = '就绪';
            return;
        }
        fileListDiv.classList.remove('hidden');
        fileListDiv.innerHTML = '';
        selectedFiles.forEach((f, idx) => {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.draggable = true;
            item.dataset.index = idx;
            const name = f.name || '粘贴图片_' + (idx + 1) + '.png';
            const displayName = name.length > 50 ? name.substring(0, 47) + '...' : name;
            item.innerHTML = '<span class="drag-handle">⋮⋮</span><span class="name">' + (idx + 1) + '. ' + displayName + '</span><button class="btn-remove" data-index="' + idx + '">✕</button>';
            item.addEventListener('dragstart', e => {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', idx);
                item.classList.add('dragging');
            });
            item.addEventListener('dragend', () => {
                item.classList.remove('dragging');
                fileListDiv.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            });
            item.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; item.classList.add('drag-over'); });
            item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
            item.addEventListener('drop', e => {
                e.preventDefault();
                item.classList.remove('drag-over');
                const from = parseInt(e.dataTransfer.getData('text/plain'));
                const to = idx;
                if (from !== to) {
                    const [m] = selectedFiles.splice(from, 1);
                    selectedFiles.splice(to, 0, m);
                    updateFileListUI();
                    addLog('↕ 已调整排序');
                }
            });
            item.querySelector('.btn-remove').addEventListener('click', e => {
                e.stopPropagation();
                selectedFiles.splice(idx, 1);
                updateFileListUI();
                addLog('✖ 已移除');
            });
            fileListDiv.appendChild(item);
        });
        processBtn.disabled = false;
    }

    function addFiles(files) {
        if (!files || files.length === 0) return;
        const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
        if (imageFiles.length === 0) { addLog('未包含有效图片文件', 'error'); return; }
        selectedFiles.push(...imageFiles);
        updateFileListUI();
        addLog('添加 ' + imageFiles.length + ' 张图片，当前总计 ' + selectedFiles.length + ' 张');
    }

    async function addFromClipboard() {
        try {
            const clipboardItems = await navigator.clipboard.read();
            const imageFiles = [];
            for (const item of clipboardItems) {
                const imageTypes = item.types.filter(type => type.startsWith('image/'));
                for (const type of imageTypes) {
                    const blob = await item.getType(type);
                    const fileName = '粘贴图片_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6) + '.png';
                    imageFiles.push(new File([blob], fileName, { type }));
                }
            }
            if (imageFiles.length === 0) { addLog('剪贴板中没有找到图片数据', 'error'); return false; }
            selectedFiles.push(...imageFiles);
            updateFileListUI();
            addLog('从剪贴板添加 ' + imageFiles.length + ' 张图片，当前总计 ' + selectedFiles.length + ' 张');
            return true;
        } catch (err) {
            addLog('粘贴失败: ' + err.message, 'error');
            return false;
        }
    }

    async function requestClipboardPermission() {
        if (permissionGranted) return true;
        try {
            await navigator.clipboard.read();
            permissionGranted = true;
            addLog('剪贴板权限已获取');
            return true;
        } catch (err) {
            addLog('需要允许剪贴板权限', 'error');
            return false;
        }
    }

    async function activatePasteMode() {
        if (!permissionGranted) {
            const granted = await requestClipboardPermission();
            if (!granted) { pasteStatus.innerHTML = '⚠️ 需要权限'; return; }
        }
        pasteModeActive = true;
        pasteHint.classList.add('active');
        pasteStatus.innerHTML = '✅ 粘贴模式已激活，现在按 Ctrl+V 即可粘贴图片';
        addLog('粘贴模式已激活', 'success');
    }
    function deactivatePasteMode() {
        pasteModeActive = false;
        pasteHint.classList.remove('active');
        pasteStatus.innerHTML = '点击后按 Ctrl+V 粘贴截图';
        addLog('粘贴模式已退出');
    }
    async function onPaste(e) {
        if (!pasteModeActive) return;
        e.preventDefault();
        addLog('检测到粘贴操作…');
        await addFromClipboard();
    }

    function resetFiles() {
        selectedFiles = [];
        updateFileListUI();
        addLog('已清空所有图片');
        fileInput.value = '';
    }

    // ====== 颜色预览 ======
    function updateColorPreview() { colorPreview.style.background = bgColorInput.value.trim(); }
    bgColorInput.addEventListener('input', () => { updateColorPreview(); saveSettings(); });
    updateColorPreview();

    function getParams() {
        let width = parseInt(imgWidthInput.value, 10) || null;
        let gap = parseInt(gapInput.value, 10) || 10;
        let margin = parseInt(marginInput.value, 10) || 20;
        let bgColor = bgColorInput.value.trim() || '#FFFFFF';
        let drawFilename = showFilename.checked;
        return { width, gap, margin, bgColor, drawFilename, showExt: showExt.checked };
    }

    // ====== 文件名标签自适应 ======
    function getTextColorForBg(bgColor) {
        const hex = bgColor.replace('#', '');
        const r = parseInt(hex.substring(0, 2), 16) || 255;
        const g = parseInt(hex.substring(2, 4), 16) || 255;
        const b = parseInt(hex.substring(4, 6), 16) || 255;
        const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
        return luminance > 128 ? '#1e293b' : '#FFFFFF';
    }

    function wrapText(ctx, text, maxWidth) {
        const lines = [];
        let line = '';
        for (let i = 0; i < text.length; i++) {
            const ch = text[i];
            const test = line + ch;
            if (ctx.measureText(test).width > maxWidth && line.length > 0) { lines.push(line); line = ch; }
            else { line = test; }
        }
        if (line) lines.push(line);
        return lines.length ? lines : [text];
    }

    function calcFilenameHeight(ctx, imgWidth, fileName) {
        const fontSize = Math.max(12, Math.round(imgWidth / 40));
        ctx.font = fontSize + 'px "Microsoft YaHei","微软雅黑",sans-serif';
        const lines = wrapText(ctx, fileName, imgWidth - 12);
        const lineH = fontSize * 1.5;
        return { lines, fontSize, lineH, totalH: lines.length * lineH + 12 };
    }

    function drawFilenameBelowImage(ctx, imgWidth, imgHeight, fileName, bgColor) {
        const info = calcFilenameHeight(ctx, imgWidth, fileName);
        const textColor = getTextColorForBg(bgColor);
        const labelBg = textColor === '#FFFFFF' ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.12)';
        const labelY = imgHeight;
        const labelH = info.totalH;
        ctx.fillStyle = labelBg;
        ctx.fillRect(0, labelY, imgWidth, labelH);
        ctx.strokeStyle = textColor === '#FFFFFF' ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.1)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, labelY); ctx.lineTo(imgWidth, labelY); ctx.stroke();
        ctx.fillStyle = textColor;
        ctx.font = info.fontSize + 'px "Microsoft YaHei","微软雅黑",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        for (let i = 0; i < info.lines.length; i++) {
            ctx.fillText(info.lines[i], imgWidth / 2, labelY + 6 + i * info.lineH);
        }
        return labelH;
    }

    function loadImageAsRGB(file, bgColor, targetWidth, drawFilename, fileName) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const useWidth = targetWidth || img.width;
                const imgHeight = targetWidth ? Math.round(img.height * (targetWidth / img.width)) : img.height;
                let labelH = 0;
                if (drawFilename && fileName) {
                    const tmpC = document.createElement('canvas').getContext('2d');
                    labelH = calcFilenameHeight(tmpC, useWidth, fileName).totalH;
                }
                const totalH = imgHeight + labelH;
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = useWidth; tempCanvas.height = totalH;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.fillStyle = bgColor; tempCtx.fillRect(0, 0, useWidth, totalH);
                tempCtx.drawImage(img, 0, 0, useWidth, imgHeight);
                if (drawFilename && fileName && labelH > 0) {
                    drawFilenameBelowImage(tempCtx, useWidth, imgHeight, fileName, bgColor);
                }
                const outputImg = new Image();
                outputImg.onload = () => resolve(outputImg);
                outputImg.onerror = () => reject(new Error('渲染失败'));
                outputImg.src = tempCanvas.toDataURL('image/png');
            };
            img.onerror = () => reject(new Error('图片加载失败'));
            img.src = URL.createObjectURL(file);
        });
    }

    async function processGridMode(loadedImages, gap, margin, bgColor) {
        const N = loadedImages.length, cols = Math.ceil(Math.sqrt(N)), rows = Math.ceil(N / cols);
        addLog('网格拼图：' + rows + ' 行 × ' + cols + ' 列');
        const colWidths = new Array(cols).fill(0);
        for (let r = 0; r < rows; r++) {
            const start = r * cols, end = Math.min(start + cols, N);
            for (let c = start; c < end; c++) { colWidths[c - start] = Math.max(colWidths[c - start], loadedImages[c].width); }
        }
        const rowHeights = new Array(rows).fill(0);
        for (let r = 0; r < rows; r++) {
            const start = r * cols, end = Math.min(start + cols, N);
            for (let i = start; i < end; i++) { rowHeights[r] = Math.max(rowHeights[r], loadedImages[i].height); }
        }
        const totalWidth = colWidths.reduce((a, b) => a + b, 0) + (cols - 1) * gap + 2 * margin;
        const totalHeight = rowHeights.reduce((a, b) => a + b, 0) + (rows - 1) * gap + 2 * margin;
        const canvas = document.createElement('canvas'); canvas.width = totalWidth; canvas.height = totalHeight;
        const ctx = canvas.getContext('2d'); ctx.fillStyle = bgColor; ctx.fillRect(0, 0, totalWidth, totalHeight);
        let currentY = margin;
        for (let r = 0; r < rows; r++) {
            const start = r * cols, end = Math.min(start + cols, N);
            let currentX = margin;
            for (let c = start; c < end; c++) {
                const colW = colWidths[c - start];
                const imgW = loadedImages[c].width;
                const imgH = loadedImages[c].height;
                const offsetX = currentX + Math.floor((colW - imgW) / 2);
                const offsetY = currentY + Math.floor((rowHeights[r] - imgH) / 2);
                ctx.drawImage(loadedImages[c], offsetX, offsetY, imgW, imgH);
                currentX += colW + gap;
            }
            currentY += rowHeights[r] + gap;
        }
        return { canvas, totalWidth, totalHeight };
    }

    async function processVerticalMode(loadedImages, gap, margin, bgColor) {
        const N = loadedImages.length; addLog('长拼图：垂直拼接 ' + N + ' 张图片');
        const maxWidth = Math.max(...loadedImages.map(img => img.width));
        let totalImgHeight = 0; for (let img of loadedImages) totalImgHeight += img.height;
        const totalHeight = totalImgHeight + (N - 1) * gap + 2 * margin, totalWidth = maxWidth + 2 * margin;
        const canvas = document.createElement('canvas'); canvas.width = totalWidth; canvas.height = totalHeight;
        const ctx = canvas.getContext('2d'); ctx.fillStyle = bgColor; ctx.fillRect(0, 0, totalWidth, totalHeight);
        let currentY = margin;
        for (let i = 0; i < N; i++) {
            const imgW = loadedImages[i].width;
            const offsetX = margin + Math.floor((maxWidth - imgW) / 2);
            ctx.drawImage(loadedImages[i], offsetX, currentY, imgW, loadedImages[i].height);
            currentY += loadedImages[i].height + gap;
        }
        return { canvas, totalWidth, totalHeight };
    }

    async function processImages() {
        if (processing) { addLog('已有任务进行中', 'error'); return; }
        if (selectedFiles.length === 0) { addLog('没有图片', 'error'); return; }
        processing = true; processBtn.disabled = true; resetBtn.disabled = true;
        progressBar.classList.remove('hidden');
        progressBar.value = 0;
        statusSpan.innerText = '加载图片中...';
        const params = getParams(), mode = getCurrentMode();
        const targetWidth = params.width;
        addLog('开始处理，模式：' + (mode === 'grid' ? '网格拼图' : '长拼图') + '，共 ' + selectedFiles.length + ' 张' + (targetWidth ? '，统一宽度 ' + targetWidth + 'px' : '，使用原图宽度'));
        const loadedImages = []; let failedCount = 0;
        for (let i = 0; i < selectedFiles.length; i++) {
            try {
                let fName = selectedFiles[i].name || '图片_' + (i + 1);
                // 后缀开关：不显示扩展名时去掉最后一个 . 段
                if (params.drawFilename && !params.showExt) fName = fName.replace(/\.[^./\\]+$/, '');
                const img = await loadImageAsRGB(selectedFiles[i], params.bgColor, targetWidth, params.drawFilename, fName);
                loadedImages.push(img);
                progressBar.value = (i / selectedFiles.length) * 30;
                statusSpan.innerText = '加载中 ' + (i + 1) + '/' + selectedFiles.length;
            } catch (err) {
                failedCount++;
                addLog('加载失败 ' + (selectedFiles[i].name || '图片') + ': ' + err.message, 'error');
            }
        }
        if (loadedImages.length === 0) {
            addLog('没有成功加载任何图片', 'error');
            processing = false; processBtn.disabled = false; resetBtn.disabled = false;
            progressBar.classList.add('hidden');
            statusSpan.innerText = '就绪';
            return;
        }
        let result;
        try {
            result = mode === 'grid'
                ? await processGridMode(loadedImages, params.gap, params.margin, params.bgColor)
                : await processVerticalMode(loadedImages, params.gap, params.margin, params.bgColor);
        } catch (err) {
            addLog('拼接失败: ' + err.message, 'error');
            processing = false; processBtn.disabled = false; resetBtn.disabled = false;
            progressBar.classList.add('hidden');
            return;
        }
        progressBar.value = 95;
        statusSpan.innerText = '生成下载链接...';
        result.canvas.toBlob(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url;
            a.download = (mode === 'grid' ? '网格' : '长图') + '_拼图_' + loadedImages.length + '张.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            addLog('✅ 拼接完成！尺寸 ' + result.totalWidth + '×' + result.totalHeight + ' 像素，已开始下载', 'success');
            statusSpan.innerText = '完成';
            progressBar.classList.add('hidden');
            processing = false; processBtn.disabled = false; resetBtn.disabled = false; progressBar.value = 0;
        }, 'image/png');
    }

    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
    dropzone.addEventListener('drop', e => {
        e.preventDefault();
        dropzone.classList.remove('drag-over');
        const items = e.dataTransfer.items;
        if (items && items.length) {
            const files = [];
            for (let i = 0; i < items.length; i++) {
                const file = items[i].getAsFile();
                if (file && file.type.startsWith('image/')) files.push(file);
            }
            if (files.length) addFiles(files);
            else addLog('未检测到图片文件', 'error');
        }
    });
    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => { if (e.target.files.length) addFiles(e.target.files); fileInput.value = ''; });
    pasteHint.addEventListener('click', async e => { if (e.target === exitPasteBtn) return; await activatePasteMode(); });
    exitPasteBtn.addEventListener('click', e => { e.stopPropagation(); deactivatePasteMode(); });
    document.addEventListener('paste', onPaste);
    resetBtn.addEventListener('click', resetFiles);
    processBtn.addEventListener('click', processImages);

    loadSettings();
    syncExtOption();
    addLog('工具启动 · 支持点击 / 拖拽添加图片，或激活粘贴模式用 Ctrl+V 粘贴截图');
})();
</script>
</body>
</html>
