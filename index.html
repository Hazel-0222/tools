<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Tools - 在线工具合集</title>
<script>
// 主题预载（防闪烁）：优先记忆值，否则跟随系统
(function () {
    try {
        var t = localStorage.getItem('ui-theme');
        if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
})();
</script>
<style>
:root {
    /* ── 浅色主题 Token ── */
    --bg: #eef0fb;
    --page-bg-image:
        radial-gradient(900px 520px at 10% -10%, rgba(0,113,227,.145), transparent 60%),
        radial-gradient(760px 480px at 90% 0%, rgba(122,92,255,.125), transparent 60%),
        radial-gradient(840px 560px at 50% 108%, rgba(255,154,186,.105), transparent 60%),
        linear-gradient(165deg, #e7ecfb 0%, #eee9fc 55%, #f6ecf2 100%);
    --card-bg: #ffffff;
    --input-bg: rgba(255,255,255,0.85);
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --border: #e2e2e7;
    --primary: #0071e3;
    --primary-soft: #e8f2fe;
    --hover-bg: rgba(0,0,0,0.045);
    --chip-bg: rgba(0,0,0,0.05);
    --chip-active-bg: rgba(0,113,227,0.12);
    --hd-veil: rgba(255,255,255,0.65);
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-hover: 0 8px 24px rgba(0,0,0,0.12);
    --panel-shadow:
        0 2px 8px rgba(13,25,60,0.04),
        0 24px 56px -16px rgba(13,25,60,0.14);
    --panel-shadow-hover:
        0 4px 12px rgba(13,25,60,0.06),
        0 32px 72px -20px rgba(13,25,60,0.24);
}
[data-theme="dark"] {
    /* ── 深色主题 Token ── */
    --bg: #0f1016;
    --page-bg-image:
        radial-gradient(900px 520px at 10% -10%, rgba(80,140,255,.13), transparent 60%),
        radial-gradient(760px 480px at 90% 0%, rgba(139,124,255,.10), transparent 60%),
        radial-gradient(840px 560px at 50% 108%, rgba(255,140,180,.06), transparent 60%),
        linear-gradient(165deg, #12131f 0%, #0f0f1a 55%, #150f1b 100%);
    --card-bg: #1a1b22;
    --input-bg: #14151c;
    --text: #ededf1;
    --text-secondary: #9a9ba5;
    --border: #2a2b33;
    --primary: #5ea2f5;
    --primary-soft: rgba(94,162,245,0.16);
    --hover-bg: rgba(255,255,255,0.06);
    --chip-bg: rgba(255,255,255,0.08);
    --chip-active-bg: rgba(94,162,245,0.18);
    --hd-veil: rgba(255,255,255,0.05);
    --shadow: 0 1px 2px rgba(0,0,0,0.5);
    --shadow-hover: 0 8px 24px rgba(0,0,0,0.5);
    --panel-shadow:
        0 8px 20px rgba(0,0,0,0.34),
        0 32px 64px -16px rgba(0,0,0,0.42);
    --panel-shadow-hover:
        0 10px 26px rgba(0,0,0,0.42),
        0 40px 80px -20px rgba(0,0,0,0.52);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    background-image: var(--page-bg-image);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 44px 24px 80px;
    transition: background-color 0.3s, color 0.3s;
}
.container { max-width: 1060px; margin: 0 auto; }

/* ── 顶部：标题 + 搜索 + 主题切换 ── */
.hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
}
h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
.subtitle { color: var(--text-secondary); font-size: 13px; margin-top: 3px; line-height: 1.55; }
.hero-actions { display: flex; align-items: center; gap: 10px; }
.search {
    display: flex; align-items: center; gap: 8px;
    width: 260px; height: 38px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 14px;
    color: var(--text-secondary);
}
.search:focus-within { border-color: var(--primary); }
.search input {
    flex: 1; min-width: 0;
    border: none; outline: none; background: transparent;
    font: inherit; font-size: 14px; color: var(--text);
}
.search input::placeholder { color: var(--text-secondary); }
.theme-toggle {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--input-bg);
    font-size: 16px; cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
}
.theme-toggle:hover { transform: scale(1.08); }

/* ── 分类卡片：一行两列并排 ── */
#sections {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    align-items: start;
    margin-top: 36px;
}
.cat-panel {
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: var(--panel-shadow);
    overflow: hidden;
    scroll-margin-top: 24px;
    transition: box-shadow 0.2s, transform 0.2s;
}
.cat-panel:hover { box-shadow: var(--panel-shadow-hover); transform: translateY(-3px); }
.cat-hd {
    position: relative;
    z-index: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 26px 16px;
}
.cat-hd::before {
    /* 65% 白纱：页面淡彩透白纱，圆角跟随卡片顶部 */
    content: "";
    position: absolute;
    z-index: -1;
    inset: 0;
    background:
        linear-gradient(var(--hd-veil), var(--hd-veil)),
        var(--page-bg-image);
}
.cat-hd .ico { font-size: 34px; line-height: 1; flex-shrink: 0; }
.cat-hd .hdtext { min-width: 0; }
.cat-title { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
.cat-desc { font-size: 13px; color: var(--text-secondary); margin-top: 3px; }

/* 工具列表：从上到下 */
.tool-list { padding: 4px 10px 10px; }
.tool-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 12px;
    text-decoration: none;
    color: var(--text);
    transition: background 0.15s;
}
.tool-item:hover { background: var(--hover-bg); }
.tool-item + .tool-item { border-top: 1px solid var(--border); }
.ti-txt { flex: 1; min-width: 0; }
.ti-name { font-size: 15px; font-weight: 500; }
.ti-desc { font-size: 13px; color: var(--text-secondary); margin-top: 2px; line-height: 1.45; }
.ti-arrow { color: var(--text-secondary); font-size: 18px; flex-shrink: 0; }

/* ── 无搜索结果空态 ── */
.empty-state {
    text-align: center;
    color: var(--text-secondary);
    padding: 56px 0 40px;
    font-size: 15px;
}

/* ── 移动端 ── */
@media (max-width: 860px) {
    body { padding: 32px 18px 64px; }
    .hero-actions { width: 100%; }
    .search { flex: 1; width: auto; min-width: 0; }
    #sections { grid-template-columns: 1fr; gap: 20px; }
    .cat-panel { border-radius: 14px; }
    .cat-hd { padding: 18px 20px 14px; }
    .tool-list { padding: 2px 6px 8px; }
}
</style>
</head>
<body>
<div class="container">
    <header class="hero">
        <div>
            <h1>Tools</h1>
            <p class="subtitle">纯浏览器端工具合集，无需安装，打开即用</p>
        </div>
        <div class="hero-actions">
            <div class="search" role="search">
                <span>🔍</span>
                <input id="search-input" type="search" placeholder="搜索工具…" autocomplete="off" aria-label="搜索工具">
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换明暗模式">🌙</button>
        </div>
    </header>

    <main id="sections"></main>
    <div id="empty-state" class="empty-state" hidden>🔍 未找到匹配的工具</div>
</div>

<script>
// ── 工具数据（与 tools.json 保持一致；file:// 直开时作为兜底） ──
const TOOLS = [
    { "name": "图片拼接", "desc": "网格拼接、长图合成，支持粘贴截图，纯浏览器处理", "category": "Image", "path": "image/image-stitch/" },
    { "name": "取色器", "desc": "粘贴或拖拽图片，统计占比前五的主色，点击像素读取色值", "category": "Image", "path": "image/color-picker/" },
    { "name": "Word 图片提取", "desc": "从 .docx 文件中提取所有图片，按文档顺序排列", "category": "Word", "path": "word/word-extract-images/" },
    { "name": "Word 差异对比", "desc": "对比两个 .docx 文档差异，段落级比对，支持导出报告", "category": "Word", "path": "word/word-diff/" },
    { "name": "Excel 目录生成", "desc": "自动生成工作表目录页，超链接跳转，纯浏览器处理", "category": "Excel", "path": "excel/excel-add-toc/" },
    { "name": "TTS 文本转语音", "desc": "离线语音合成，输入文字生成 WAV 音频，需启动 Python 服务", "category": "TTS", "path": "tts/" }
];

// 分类元信息（图标 + 卡片头说明）
const CATEGORY_META = {
    Image: { icon: "🖼️", desc: "图像处理工具" },
    Word:  { icon: "📄", desc: "Word 文档处理工具" },
    Excel: { icon: "📊", desc: "Excel 表格处理工具" },
    TTS:   { icon: "🎙️", desc: "离线语音合成工具" }
};

const slug = s => String(s).toLowerCase().replace(/\s+/g, '-').replace(/[^\w一-龥-]/g, '');
const searchInput = document.getElementById('search-input');
const emptyState = document.getElementById('empty-state');

// ── 主题切换 ──
const themeToggle = document.getElementById('theme-toggle');
function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
}
applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    try { localStorage.setItem('ui-theme', next); } catch (e) {}
    applyTheme(next);
});

// ── 搜索过滤（名称/描述/分类，大小写不敏感，实时） ──
function applyFilter() {
    const q = searchInput.value.trim().toLowerCase();
    let anyVisible = false;
    document.querySelectorAll('.cat-panel').forEach(sec => {
        let shown = 0;
        sec.querySelectorAll('.tool-item').forEach(item => {
            const hit = !q || item.textContent.toLowerCase().includes(q);
            item.style.display = hit ? '' : 'none';
            if (hit) shown++;
        });
        sec.style.display = shown ? '' : 'none';
        if (shown) anyVisible = true;
    });
    emptyState.hidden = q ? anyVisible : true;
}
searchInput.addEventListener('input', applyFilter);

// ── 渲染：分类大卡 + 左侧导航 ──
function render() {
    const cats = [];
    TOOLS.forEach(t => {
        t.category = t.category || '其他';
        let c = cats.find(x => x.name === t.category);
        if (!c) { c = { name: t.category, tools: [] }; cats.push(c); }
        c.tools.push(t);
    });

    document.getElementById('sections').innerHTML = cats.map(c => {
        const meta = CATEGORY_META[c.name] || { icon: '📦', desc: '' };
        const items = c.tools.map(t =>
            `<a class="tool-item" href="${t.path}">` +
                `<div class="ti-txt">` +
                    `<div class="ti-name">${t.name}</div>` +
                    `<div class="ti-desc">${t.desc || ''}</div>` +
                `</div>` +
                `<span class="ti-arrow">›</span>` +
            `</a>`
        ).join('');
        return `<section class="cat-panel" id="cat-${slug(c.name)}">` +
            `<div class="cat-hd">` +
                `<div class="ico">${meta.icon}</div>` +
                `<div class="hdtext">` +
                    `<h2 class="cat-title">${c.name}</h2>` +
                    `<p class="cat-desc">${meta.desc}</p>` +
                `</div>` +
            `</div>` +
            `<div class="tool-list">${items}</div>` +
        `</section>`;
    }).join('');

    applyFilter();
}

// 先立即渲染内置数据；有服务时再用 tools.json 覆盖刷新
render();
fetch('tools.json')
    .then(r => { if (!r.ok) throw new Error('tools.json 不可用'); return r.json(); })
    .then(data => {
        if (Array.isArray(data) && data.length) {
            TOOLS.splice(0, TOOLS.length, ...data);
            render();
        }
    })
    .catch(() => {});
</script>
</body>
</html>
