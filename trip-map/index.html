<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行程路线图</title>
<style>
  html,body{margin:0;height:100%;font-family:"Microsoft YaHei",sans-serif}
  #map{width:100%;height:100%}
  #legend{position:fixed;top:12px;left:12px;background:rgba(255,255,255,.94);
          box-shadow:0 2px 8px rgba(0,0,0,.25);border-radius:8px;padding:10px 14px;
          font-size:13px;max-height:70vh;overflow:auto;z-index:999}
  #legend h3{margin:0 0 8px;font-size:14px}
  .item{display:flex;align-items:center;gap:6px;margin:4px 0}
  .line{width:22px;height:3px;border-radius:2px;flex:none}
  .num{width:16px;height:16px;line-height:16px;text-align:center;background:#333;
       color:#fff;border-radius:50%;font-size:10px;flex:none}
  .num.sol{background:none;color:#888;font-size:9px}
  .focus-hint{color:#c62828;font-size:12px;margin-top:6px;display:none}
  .tp-pin{background:#1e88e5;color:#fff;width:20px;height:20px;border-radius:50% 50% 50% 0;
          transform:rotate(-45deg);text-align:center;line-height:20px;font-size:11px;
          box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .tp-pin span{transform:rotate(45deg);display:inline-block}
  .dst-pin{background:#d81b60;color:#fff;width:18px;height:18px;border-radius:50%;
           text-align:center;line-height:18px;font-size:10px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .sec-head{margin:10px 0 4px;font-size:12px;color:#666;border-top:1px dashed #ccc;padding-top:8px}
  .plc{font-size:12px}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
  .day-head{display:flex;justify-content:space-between;align-items:center;
            margin:10px 0 4px;font-size:13px;font-weight:700;
            border-top:1px dashed #ccc;padding-top:8px}
  .day-head .only{font-weight:400;font-size:11px;color:#1e88e5;cursor:pointer;text-decoration:none}
  .km-bar{display:flex;align-items:center;gap:6px;font-size:12px;color:#666;
          padding:6px 0;border-bottom:1px dashed #ccc;margin-bottom:6px}
  .km-bar input{width:64px;padding:3px 6px;border:1px solid #ccc;border-radius:4px;font-size:12px}
  .km-bar a{color:#1e88e5;cursor:pointer;text-decoration:none;font-size:12px}
  .km-bar a.disabled{color:#bbb;cursor:default}
  .item.hidden{display:none}
</style>
</head>
<body>
<div id="map"></div>
<div id="legend">
  <h3>🚗 行程路线图</h3>
  <div class="km-bar">
    隐藏超过
    <input type="number" id="kmMax" min="0" step="1" placeholder="公里">
    <a href="javascript:void(0)" id="kmApply">隐藏</a>
    <a href="javascript:void(0)" id="kmReset">全部显示</a>
  </div>
  <div id="items"></div>
  <div class="focus-hint" id="focusHint"></div>
</div>

me": "2026-10-07 09:45", "day": "2026-10-07", "transport": "", "voucher": "", "solo": false, "km": 682.2}, {"page_id": "3e2e167b-20da-801e-8e50-ff5cfcd340df", "page_no": 20, "no": 20, "origin": "广州南站", "dest": "南昌西站", "origin_lnglat": [113.277732, 22.989125], "dest_lnglat": [115.792516, 28.624876], "pts": [], "time": "2026-10-07 14:00", "day": "2026-10-07", "transport": "", "voucher": "", "solo": false, "km": 675.3}];
const COLORS = ["#e6194b","#f58231","#ffb000","#3cb44b","#00c2a8","#42d4f4",
                "#3b82f6","#4363d8","#a020f0","#f032e6","#ff5c93","#ff1493",
                "#8b4513","#c71585","#808000","#1e90ff"];
const legend = document.getElementById('items');
const quitHint = document.getElementById('focusHint');

function esc(s){
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtTrip(t){
  if(t.solo){
    const parts = [esc(t.origin)];
    if(t.time) parts.push(esc(t.time));
    if(t.transport) parts.push('🚌 ' + esc(t.transport));
    if(t.voucher) parts.push('📄 ' + esc(t.voucher));
    return parts.join(' · ');
  }
  const parts = [esc(t.origin) + ' → ' + esc(t.dest)];
  if(t.time) parts.push(esc(t.time));
  if(t.km) parts.push('📏 ' + t.km + ' km');
  if(t.transport) parts.push('🚌 ' + esc(t.transport));
  if(t.voucher) parts.push('📄 ' + esc(t.voucher));
  return parts.join(' · ');
}

if(!window.AMap){
  legend.innerHTML = '<div class="item">高德 JS API 加载失败：JS Key 未配置，或域名未加入白名单（需含 https://hazel-0222.github.io 与 http://127.0.0.1）</div>';
}
if(trips.length === 0){
  legend.innerHTML = '<div class="item">没有可显示的行程（可能起终点地理编码失败）</div>';
}

let map = null;
let markers = [];
const places = [];

let allDaysShown = true;   // true=全部天显示；false=只显示 selectedDay
let selectedDay = '';
let kmMax = 0;              // 0=不限；>0 时隐藏直线距离超过该公里的段

function draw(){
  if(!window.AMap || trips.length === 0) return;
  map = new AMap.Map('map', {zoom:6});
  const allMarkers = [];
  const groups = new Map();          // day -> [{markers, item, wrap}]
  trips.forEach((t, i) => {
    const color = COLORS[i % COLORS.length];
    const no = t.no;
    // 起点图钉
    const startMarker = new AMap.Marker({
      position:t.origin_lnglat,
      content:'<div class="tp-pin"><span>' + no + '</span></div>',
      offset:new AMap.Pixel(-10,-18)
    });
    startMarker.on('click', () => { focusTrip(i); });
    let destMarker = null, line = null;
    if(!t.solo){
      destMarker = new AMap.Marker({
        position:t.dest_lnglat,
        content:'<div class="dst-pin">↓</div>',
        offset:new AMap.Pixel(-9,-9)
      });
      // 连线：有真实轨迹用轨迹，否则起终点直线（保留方向箭头 showDir）
      const path = (t.pts && t.pts.length > 1) ? t.pts : [t.origin_lnglat, t.dest_lnglat];
      line = new AMap.Polyline({
        path, strokeColor:color, strokeWeight:5, strokeOpacity:.9,
        lineJoin:'round', showDir:true          // 箭头指示行进方向
      });
      line.on('click', () => { focusTrip(i); });
      map.add([destMarker, line]);
    }
    map.add(startMarker);
    allMarkers.push(startMarker); if(destMarker) allMarkers.push(destMarker);
    const entry = {no:no, startMarker:startMarker, destMarker:destMarker,
                   line:line, t:t, lineColor:color, day:t.day||'', item:null};
    markers.push(entry);
    // 图例（先按天归组，循环后统一渲染）
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = (t.solo
        ? '<span class="num sol">●</span>'
        : '<span class="line" style="background:' + color + '"></span>') +
                     '<span class="num">' + no + '</span>' +
                     '<span>' + fmtTrip(t) + '</span>';
    item.style.cursor = 'pointer';
    item.onclick = () => { focusTrip(i); };
    entry.item = item;
    const day = entry.day;
    if(!groups.has(day)) groups.set(day, []);
    groups.get(day).push(entry);
  });

  // 按天渲染：Day 1 · 10/03 标题 + 该天行程，带「仅看」开关
  let dayIdx = 0;
  groups.forEach((entries, day) => {
    dayIdx++;
    const label = day ? ('Day ' + dayIdx + ' · ' + day.slice(5).replace('-', '/'))
                      : ('Day ' + dayIdx + ' · 未设日期');
    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML = '<span>' + label + '</span>' +
                     '<a class="only" href="javascript:void(0)">仅看</a>';
    const btn = head.querySelector('.only');
    btn.onclick = () => toggleDay(day, btn);
    legend.appendChild(head);
    const wrap = document.createElement('div');
    entries.forEach(o => wrap.appendChild(o.item));
    legend.appendChild(wrap);
  });
  // 地点快捷列表：去重所有起终点，点击定位到该地点
  const addPlace = (name, lnglat, marker, color) => {
    if(!name) return;
    if(places.find(p => p.name === name)) return;
    places.push({name:name, lnglat:lnglat, marker:marker, color:color});
  };
  markers.forEach(x => addPlace(x.t.origin, x.t.origin_lnglat, x.startMarker, x.lineColor));
  markers.forEach(x => addPlace(x.t.dest,   x.t.dest_lnglat,   x.destMarker,   x.lineColor));
  if(places.length){
    const head = document.createElement('div');
    head.className = 'sec-head';
    head.textContent = '📍 全部地点（点击定位）';
    legend.appendChild(head);
    places.forEach(p => {
      const it = document.createElement('div');
      it.className = 'item plc';
      it.innerHTML = '<span class="dot" style="background:' + p.color + '"></span>' +
                     '<span>' + esc(p.name) + '</span>';
      it.style.cursor = 'pointer';
      it.onclick = () => { focusPlace(p); };
      legend.appendChild(it);
    });
  }
  map.setFitView(allMarkers, false, [50,50,50,50], 14);
  // 默认打开第一条
  if(trips.length) focusTrip(0, true);
}

// 点击地点：居中放大地图 + 图钉弹跳强调
function focusPlace(p){
  if(!map) return;
  if(p.marker && p.marker.setPosition){
    map.setZoomAndCenter(15, p.lnglat);
    if(p.marker.setAnimation){
      p.marker.setAnimation('AMAP_ANIMATION_BOUNCE');
      setTimeout(()=>{ try{ p.marker.setAnimation(''); }catch(e){} }, 1300);
    }
  }
}

// 可见性统一判定：同时考虑「仅看某一天」和「公里上限过滤」
function isVisible(entry){
  if(!allDaysShown && entry.day !== selectedDay) return false;   // 非选中天
  if(kmMax > 0 && entry.t.km && entry.t.km > kmMax) return false; // 超长路线
  return true;
}

// 按当前状态刷新所有线/图钉/图例
function refresh(){
  markers.forEach(x=>{
    const vis = isVisible(x);
    x.startMarker.setMap(vis ? map : null);
    if(x.destMarker) x.destMarker.setMap(vis ? map : null);
    if(x.line) x.line.setMap(vis ? map : null);
    x.item.classList.toggle('hidden', !vis);
  });
}

// 「仅看」开关：只看某一天的线/图钉，再点恢复全部
function toggleDay(day, btn){
  if(allDaysShown){
    allDaysShown = false;
    selectedDay = day;
    document.querySelectorAll('.only').forEach(b=>{ if(b!==btn) b.textContent='恢复'; });
    btn.textContent='恢复';
  } else if(selectedDay === day){
    allDaysShown = true;
    selectedDay = '';
    document.querySelectorAll('.only').forEach(b=>b.textContent='仅看');
  } else {
    selectedDay = day;
    document.querySelectorAll('.only').forEach(b=>{ if(b!==btn) b.textContent='仅看'; });
    btn.textContent='恢复';
  }
  refresh();
}

// 公里上限过滤：隐藏直线距离超过指定公里的段
const kmApply = document.getElementById('kmApply');
const kmReset = document.getElementById('kmReset');
const kmInput = document.getElementById('kmMax');
function applyKm(){
  const v = parseFloat(kmInput.value);
  kmMax = (v && v > 0) ? v : 0;
  kmApply.classList.toggle('disabled', kmMax === 0);
  refresh();
}
kmApply.onclick = applyKm;
kmReset.onclick = () => { kmInput.value = ''; kmMax = 0; kmApply.classList.remove('disabled'); refresh(); };

function showInfo(t, line){
  const win = new AMap.InfoWindow({
    content:'<div style="font-size:13px;max-width:260px"><b>#' + t.no + ' ' + fmtTrip(t) + '</b></div>'
  });
  const mid = t.pts && t.pts.length>1
      ? t.pts[Math.floor(t.pts.length/2)]
      : [(t.origin_lnglat[0]+t.dest_lnglat[0])/2,(t.origin_lnglat[1]+t.dest_lnglat[1])/2];
  win.open(map, mid);
}

// 选中行程：该段加粗变橙，其余各段回到自身颜色且统一半透明细线
function focusTrip(i, silent){
  if(!markers[i]) return;
  const m = markers[i];
  if(m.line) m.line.setOptions({strokeWeight:8, strokeColor:'#ff5722', strokeOpacity:1, zIndex:999});
  markers.forEach(x=>{
    if(x.no!==m.no && x.line){
      x.line.setOptions({strokeWeight:4, strokeColor:x.lineColor, strokeOpacity:.5, zIndex:1});
    }
  });
  if(!silent) showInfo(m.t, m.line);
  const fit = [m.startMarker]; if(m.destMarker) fit.push(m.destMarker);
  map.setFitView(fit, false, [80,80,420,80], 16);
}

// URL ?focus=<编号> 高亮
const params = new URLSearchParams(location.search);
const focusNo = params.get('focus');
if(focusNo){
  quitHint.style.display='block';
  quitHint.textContent = '焦点行程 #' + focusNo + '（点击图例任意项可切换）';
  setTimeout(()=>{
    const idx = trips.findIndex(t => String(t.no)===focusNo);
    if(idx>=0) focusTrip(idx);
  }, 400);
}

window.addEventListener('load', draw);
</script>
