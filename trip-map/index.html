const COLORS = ["#e6194b","#f58231","#ffb000","#3cb44b","#00c2a8","#42d4f4",
                "#3b82f6","#4363d8","#a020f0","#f032e6","#ff5c93","#ff1493",
                "#8b4513","#c71585","#808000","#1e90ff"];
const legend = document.getElementById('items');
const quitHint = document.getElementById('focusHint');

function esc(s){
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtTrip(t){
  const parts = [esc(t.origin) + ' → ' + esc(t.dest)];
  if(t.time) parts.push(esc(t.time));
  if(t.transport) parts.push('🚌 ' + esc(t.transport));
  if(t.voucher) parts.push('📄 ' + esc(t.voucher));
  return parts.join(' · ');
}

if(!window.AMap){
  legend.innerHTML = '<div class="item">高德 JS API 加载失败：JS Key 未配置，或域名未加入白名单（需含 https://hazel-0222.github.io 与 http://127.0.0.1）</div>';
}
if(trips.length === 0){
  legend.innerHTML = '<div class="item">没有可显示的行程（可能起终点地理编码失败）</div>';
}

let map = null;
let markers = [];
const places = [];

let allDaysShown = true;

function draw(){
  if(!window.AMap || trips.length === 0) return;
  map = new AMap.Map('map', {zoom:6});
  const allMarkers = [];
  const groups = new Map();          // day -> [{line, startMarker, destMarker, item}]
  trips.forEach((t, i) => {
    const color = COLORS[i % COLORS.length];
    const no = t.no;
    // 起点图钉
    const startMarker = new AMap.Marker({
      position:t.origin_lnglat,
      content:'<div class="tp-pin"><span>' + no + '</span></div>',
      offset:new AMap.Pixel(-10,-18)
    });
    // 终点图钉
    const destMarker = new AMap.Marker({
      position:t.dest_lnglat,
      content:'<div class="dst-pin">↓</div>',
      offset:new AMap.Pixel(-9,-9)
    });
    // 连线：有真实轨迹用轨迹，否则起终点直线（保留方向箭头 showDir）
    const path = (t.pts && t.pts.length > 1) ? t.pts : [t.origin_lnglat, t.dest_lnglat];
    const line = new AMap.Polyline({
      path, strokeColor:color, strokeWeight:5, strokeOpacity:.9,
      lineJoin:'round', showDir:true          // 箭头指示行进方向
    });
    line.on('click', () => { focusTrip(i); });
    startMarker.on('click', () => { focusTrip(i); });
    map.add([startMarker, destMarker, line]);
    allMarkers.push(startMarker, destMarker);
    markers.push({no:no, startMarker:startMarker, destMarker:destMarker,
                  line:line, t:t, lineColor:color});
    // 图例（先按天归组，循环后统一渲染）
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = '<span class="line" style="background:' + color + '"></span>' +
                     '<span class="num">' + no + '</span>' +
                     '<span>' + fmtTrip(t) + '</span>';
    item.style.cursor = 'pointer';
    item.onclick = () => { focusTrip(i); };
    const day = t.day || '';
    if(!groups.has(day)) groups.set(day, []);
    groups.get(day).push({line:line, startMarker:startMarker, destMarker:destMarker, item:item});
  });

  // 按天渲染：Day 1 · 10/03 标题 + 该天行程，带「仅看」开关
  let dayIdx = 0;
  groups.forEach((objs, day) => {
    dayIdx++;
    const label = day ? ('Day ' + dayIdx + ' · ' + day.slice(5).replace('-', '/'))
                      : ('Day ' + dayIdx + ' · 未设日期');
    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML = '<span>' + label + '</span>' +
                     '<a class="only" href="javascript:void(0)">仅看</a>';
    const btn = head.querySelector('.only');
    btn.onclick = () => toggleDay(objs, btn);
    legend.appendChild(head);
    const wrap = document.createElement('div');
    objs.forEach(o => wrap.appendChild(o.item));
    legend.appendChild(wrap);
  });
  // 地点快捷列表：去重所有起终点，点击定位到该地点
  const addPlace = (name, lnglat, marker, color) => {
    if(!name) return;
    if(places.find(p => p.name === name)) return;
    places.push({name:name, lnglat:lnglat, marker:marker, color:color});
  };
  markers.forEach(x => addPlace(x.t.origin, x.t.origin_lnglat, x.startMarker, x.lineColor));
  markers.forEach(x => addPlace(x.t.dest,   x.t.dest_lnglat,   x.destMarker,   x.lineColor));
  if(places.length){
    const head = document.createElement('div');
    head.className = 'sec-head';
    head.textContent = '📍 全部地点（点击定位）';
    legend.appendChild(head);
    places.forEach(p => {
      const it = document.createElement('div');
      it.className = 'item plc';
      it.innerHTML = '<span class="dot" style="background:' + p.color + '"></span>' +
                     '<span>' + esc(p.name) + '</span>';
      it.style.cursor = 'pointer';
      it.onclick = () => { focusPlace(p); };
      legend.appendChild(it);
    });
  }
  map.setFitView(allMarkers, false, [50,50,50,50], 14);
  // 默认打开第一条
  if(trips.length) focusTrip(0, true);
}

// 点击地点：居中放大地图 + 图钉弹跳强调
function focusPlace(p){
  if(!map) return;
  if(p.marker && p.marker.setPosition){
    map.setZoomAndCenter(15, p.lnglat);
    if(p.marker.setAnimation){
      p.marker.setAnimation('AMAP_ANIMATION_BOUNCE');
      setTimeout(()=>{ try{ p.marker.setAnimation(''); }catch(e){} }, 1300);
    }
  }
}

// 「仅看」开关：只看某一天的线/图钉，再点恢复全部
function toggleDay(objs, btn){
  if(allDaysShown){
    markers.forEach(x=>{
      x.line.setMap(null); x.startMarker.setMap(null); x.destMarker.setMap(null);
    });
    objs.forEach(o=>{
      o.line.setMap(map); o.startMarker.setMap(map); o.destMarker.setMap(map);
    });
    allDaysShown = false;
    document.querySelectorAll('.only').forEach(b=>{ if(b!==btn) b.textContent='恢复'; });
    btn.textContent='恢复';
  } else {
    markers.forEach(x=>{
      x.line.setMap(map); x.startMarker.setMap(map); x.destMarker.setMap(map);
    });
    allDaysShown = true;
    document.querySelectorAll('.only').forEach(b=>b.textContent='仅看');
  }
}

function showInfo(t, line){
  const win = new AMap.InfoWindow({
    content:'<div style="font-size:13px;max-width:260px"><b>#' + t.no + ' ' + fmtTrip(t) + '</b></div>'
  });
  const mid = t.pts && t.pts.length>1
      ? t.pts[Math.floor(t.pts.length/2)]
      : [(t.origin_lnglat[0]+t.dest_lnglat[0])/2,(t.origin_lnglat[1]+t.dest_lnglat[1])/2];
  win.open(map, mid);
}

// 选中行程：该段加粗变橙，其余各段回到自身颜色且统一半透明细线
function focusTrip(i, silent){
  if(!markers[i]) return;
  const m = markers[i];
  m.line.setOptions({strokeWeight:8, strokeColor:'#ff5722', strokeOpacity:1, zIndex:999});
  markers.forEach(x=>{
    if(x.no!==m.no){
      x.line.setOptions({strokeWeight:4, strokeColor:x.lineColor, strokeOpacity:.5, zIndex:1});
    }
  });
  if(!silent) showInfo(m.t, m.line);
  map.setFitView([m.startMarker, m.destMarker], false, [80,80,420,80], 16);
}

// URL ?focus=<编号> 高亮
const params = new URLSearchParams(location.search);
const focusNo = params.get('focus');
if(focusNo){
  quitHint.style.display='block';
  quitHint.textContent = '焦点行程 #' + focusNo + '（点击图例任意项可切换）';
  setTimeout(()=>{
    const idx = trips.findIndex(t => String(t.no)===focusNo);
    if(idx>=0) focusTrip(idx);
  }, 400);
}

window.addEventListener('load', draw);
</script>
