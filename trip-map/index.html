  .num.sol{background:none;color:#888;font-size:9px}

          box-shadow:0 1px 3px rgba(0,0,0,.4)}

  .dst-pin{background:#d81b60;color:#fff;width:18px;height:18px;border-radius:50%;
           text-align:center;line-height:18px;font-size:10px;box-shadow:0 1px 3px rgba(0,0,0,.4)}

  .plc{font-size:12px}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
  .day-head{display:flex;justify-content:space-between;align-items:center;
            margin:10px 0 4px;font-size:13px;font-weight:700;
            border-top:1px dashed #ccc;padding-top:8px}
  .day-head .only{font-weight:400;font-size:11px;color:#1e88e5;cursor:pointer;text-decoration:none}
  .km-bar{display:flex;align-items:center;gap:6px;font-size:12px;color:#666;
          padding:6px 0;border-bottom:1px dashed #ccc;margin-bottom:6px}
  .km-bar input{width:64px;padding:3px 6px;border:1px solid #ccc;border-radius:4px;font-size:12px}
  .km-bar a{color:#1e88e5;cursor:pointer;text-decoration:none;font-size:12px}
  .km-bar a.disabled{color:#bbb;cursor:default}
  .item.hidden{display:none}

// 面板可收起：点标题「收起」隐藏整个图例面板，左上角浮出「☰ 行程路线图」点击恢复
function setLegendVisible(show){
  legendPanel.style.display = show ? '' : 'none';
  legendToggle.style.display = show ? 'none' : '';
}
document.getElementById('foldBtn').onclick = () => setLegendVisible(false);
legendToggle.onclick = () => setLegendVisible(true);

function esc(s){
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 详情只显示时间 HH:MM（日期由 Day 分组标题承担）；仅日期无时刻的记录回退显示 MM-DD
function fmtTime(t){
  const s = String(t.time || '');
  const m = s.match(/^\d{4}-\d{2}-\d{2}(?: (\d{2}:\d{2}))?/);
  if(!m) return s;
  return m[1] ? m[1] : s.slice(5);
}

function fmtClock(s){
  const m = String(s || '').match(/^\d{4}-\d{2}-\d{2}(?: (\d{2}:\d{2}))?/);
  if(!m) return s;
  return m[1] ? m[1] : String(s||'').slice(5);
}
function fmtTrip(t){
  const parts = [];
  if(t.otime) parts.push(fmtClock(t.otime));
  parts.push(t.solo ? esc(t.origin) : esc(t.origin) + ' → ' + esc(t.dest));
  if(!t.solo && t.km) parts.push(t.km + ' km');
  if(t.transport) parts.push('🚌 ' + esc(t.transport));
  if(t.voucher) parts.push('📄 ' + esc(t.voucher));
  return parts.join(' · ');
}
// 方案 F 图例条目：仅「时刻 + 地点名」，不含路线、距离、交通
function fmtVisit(t){
  return fmtClock(t.otime || t.time) + '  ' + esc(t.origin);
}

      });
      // 连线：有真实轨迹用轨迹，否则起终点直线（保留方向箭头 showDir）
      const path = (t.pts && t.pts.length > 1) ? t.pts : [t.origin_lnglat, t.dest_lnglat];
      line = new AMap.Polyline({
        path, strokeColor:color, strokeWeight:5, strokeOpacity:.9,
        lineJoin:'round', showDir:true          // 箭头指示行进方向
      });
      line.on('click', () => { focusTrip(i); });
      map.add([destMarker, line]);
      // 连线中点标签：交通 + 距离（trip 的路线宣传位，替代图例里的公里数）

          : [(t.origin_lnglat[0]+t.dest_lnglat[0])/2,(t.origin_lnglat[1]+t.dest_lnglat[1])/2];

        text: lblTxt,
        position: mid,
        offset: new AMap.Pixel(0, -8),
        style:{

          'padding':'1px 6px','border-radius':'8px','white-space':'nowrap','box-shadow':'0 1px 2px rgba(0,0,0,.12)'
        }
      });
      lbl.on('click', () => { focusTrip(i); });
      map.add(lbl);
      line._lbl = lbl;
    }
    map.add(startMarker);
    allMarkers.push(startMarker); if(destMarker) allMarkers.push(destMarker);
    const entry = {no:no, startMarker:startMarker, destMarker:destMarker,
                   line:line, lbl:line ? line._lbl : null, t:t, lineColor:color, day:t.day||'', item:null,
                   // 移动日 = 出发时刻所在的日期（t.time=起点结束/出发时刻）。
                   // 图例按入住夜(entry.day)分组，但「仅看某天」过滤连线按移动日归属：
                   // 如 希岸 10-04 21:30 入住 → 庐山 10-05 06:30 出发，移动日=10-05，
                   // 点 DAY3 仅看不再出现去庐山的线。
                   mday: String(t.time || '').slice(0,10) || String(t.day || '').slice(0,10)};
    markers.push(entry);
    // 图例（先按天归组，循环后统一渲染）
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = '<span class="line" style="background:' + color + '"></span>' +
                     '<span class="num">' + no + '</span>' +
                     '<span class="txt">' + fmtVisit(t) + '</span>' +
                     (t.odur ? '<span class="dur">' + t.odur + '</span>' : '');
    item.style.cursor = 'pointer';
    // 图例条目代表「地点」：点击优先聚焦「到达该地点」的前一段路线
    // （如点击“10:00 南昌舰主题公园” → 高亮 希岸→南昌舰，而非 南昌舰→蛤蟆街）
    item.onclick = () => {
      if(i > 0 && markers[i-1] && markers[i-1].t.dest === t.origin) focusTrip(i-1);
      else focusTrip(i);
    };
    entry.item = item;
    const day = entry.day;
    if(!groups.has(day)) groups.set(day, []);
    groups.get(day).push(entry);
  });

  // 按天渲染：Day 1 · 10/03 标题 + 该天行程，带「仅看」开关
  let dayIdx = 0;
  groups.forEach((entries, day) => {
    dayIdx++;
    const label = day ? ('Day ' + dayIdx + ' · ' + day.slice(5).replace('-', '/'))
                      : ('Day ' + dayIdx + ' · 未设日期');
    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML = '<span>' + label + '</span>' +
                     '<a class="only" href="javascript:void(0)">仅看</a>';
    const btn = head.querySelector('.only');
    btn.onclick = () => toggleDay(day, btn);
    legend.appendChild(head);
    const wrap = document.createElement('div');
    entries.forEach(o => wrap.appendChild(o.item));
    legend.appendChild(wrap);
  });
  // 地点快捷列表：去重所有起终点，点击定位到该地点
  const addPlace = (name, lnglat, marker, color) => {
    if(!name) return;
    if(places.find(p => p.name === name)) return;
    places.push({name:name, lnglat:lnglat, marker:marker, color:color});
  };
  markers.forEach(x => addPlace(x.t.origin, x.t.origin_lnglat, x.startMarker, x.lineColor));
  markers.forEach(x => addPlace(x.t.dest,   x.t.dest_lnglat,   x.destMarker,   x.lineColor));
  if(places.length){
    const head = document.createElement('div');
    head.className = 'sec-head';
    head.textContent = '📍 全部地点（点击定位）';
    legend.appendChild(head);
    places.forEach(p => {
      const it = document.createElement('div');
      it.className = 'item plc';
      it.innerHTML = '<span class="dot" style="background:' + p.color + '"></span>' +
                     '<span>' + esc(p.name) + '</span>';
      it.style.cursor = 'pointer';
      it.onclick = () => { focusPlace(p); };
      legend.appendChild(it);
    });
  }
  map.setFitView(allMarkers, false, [50,50,50,50], 14);
  // 默认打开第一条
  if(trips.length) focusTrip(0, true);
}

// 点击地点：居中放大地图 + 图钉弹跳强调
function focusPlace(p){
  if(!map) return;
  if(p.marker && p.marker.setPosition){
    map.setZoomAndCenter(15, p.lnglat);
    if(p.marker.setAnimation){
      p.marker.setAnimation('AMAP_ANIMATION_BOUNCE');
      setTimeout(()=>{ try{ p.marker.setAnimation(''); }catch(e){} }, 1300);
    }
  }
}

// 连线/图钉可见性：同时考虑「仅看某一天」和「公里上限过滤」
function isVisible(entry){
  // 仅看某天时按「移动日」过滤：跨夜出发的段（如 10-04 晚入住 → 10-05 早去庐山）
  // 其移动日=10-05，点 DAY3 仅看不会把去庐山的线带出来
  if(!allDaysShown && entry.mday !== selectedDay) return false;
  if(kmMax > 0 && entry.t.km && entry.t.km > kmMax) return false; // 超长路线
  return true;
}

// 图例条目可见性：按「入住夜」的 day 分组 + 公里上限（仅看某天时该组条目保留）
function itemVisible(entry){
  if(!allDaysShown && entry.day !== selectedDay) return false;
  if(kmMax > 0 && entry.t.km && entry.t.km > kmMax) return false;
  return true;
}

// 按当前状态刷新所有线/图钉/标签/图例
function refresh(){
  markers.forEach(x=>{
    const vis = isVisible(x);
    x.startMarker.setMap(vis ? map : null);
    if(x.destMarker) x.destMarker.setMap(vis ? map : null);
    if(x.line) x.line.setMap(vis ? map : null);
    if(x.lbl) x.lbl.setMap(vis ? map : null);
    x.item.classList.toggle('hidden', !itemVisible(x));
  });
}

// 「仅看」开关：只看某一天的线/图钉，再点恢复全部
function toggleDay(day, btn){
  if(allDaysShown){
    allDaysShown = false;
    selectedDay = day;
    document.querySelectorAll('.only').forEach(b=>{ if(b!==btn) b.textContent='恢复'; });
    btn.textContent='恢复';
  } else if(selectedDay === day){
    allDaysShown = true;
    selectedDay = '';
    document.querySelectorAll('.only').forEach(b=>b.textContent='仅看');
  } else {
    selectedDay = day;
    document.querySelectorAll('.only').forEach(b=>{ if(b!==btn) b.textContent='仅看'; });
    btn.textContent='恢复';
  }
  refresh();
  // 适配地图到当前可见范围：仅看某天时放大到该天，恢复全部时回到全部
  fitToVisible();
}

// 地图适配到当前可见（未被隐藏）的行程范围
function fitToVisible(){
  if(!map) return;
  const fits = [];
  markers.forEach(x=>{
    if(!isVisible(x)) return;
    fits.push(x.startMarker);
    if(x.destMarker) fits.push(x.destMarker);
  });
  if(fits.length) map.setFitView(fits, false, [80,80,420,80], allDaysShown ? 6 : 14);
}

// 公里上限过滤：隐藏直线距离超过指定公里的段
const kmApply = document.getElementById('kmApply');
const kmReset = document.getElementById('kmReset');
const kmInput = document.getElementById('kmMax');
function applyKm(){
  const v = parseFloat(kmInput.value);
  kmMax = (v && v > 0) ? v : 0;
  kmApply.classList.toggle('disabled', kmMax === 0);
  refresh();
}
kmApply.onclick = applyKm;
kmReset.onclick = () => { kmInput.value = ''; kmMax = 0; kmApply.classList.remove('disabled'); refresh(); };

function showInfo(t, line){
  const win = new AMap.InfoWindow({
    content:'<div style="font-size:13px;max-width:260px"><b>#' + t.no + ' ' + fmtTrip(t) + '</b></div>'
  });
  const mid = t.pts && t.pts.length>1
      ? t.pts[Math.floor(t.pts.length/2)]
      : [(t.origin_lnglat[0]+t.dest_lnglat[0])/2,(t.origin_lnglat[1]+t.dest_lnglat[1])/2];
  win.open(map, mid);
}

// 选中行程：该段加粗变橙，其余各段回到自身颜色且统一半透明细线
function focusTrip(i, silent){
  if(!markers[i]) return;
  const m = markers[i];
  if(m.line) m.line.setOptions({strokeWeight:8, strokeColor:'#ff5722', strokeOpacity:1, zIndex:999});
  markers.forEach(x=>{
    if(x.no!==m.no && x.line){
      x.line.setOptions({strokeWeight:4, strokeColor:x.lineColor, strokeOpacity:.5, zIndex:1});
    }
  });
  if(!silent) showInfo(m.t, m.line);
  const fit = [m.startMarker]; if(m.destMarker) fit.push(m.destMarker);
  map.setFitView(fit, false, [80,80,420,80], 16);
}

// URL ?focus=<编号> 高亮
const params = new URLSearchParams(location.search);
const focusNo = params.get('focus');
if(focusNo){
  quitHint.style.display='block';
  quitHint.textContent = '焦点行程 #' + focusNo + '（点击图例任意项可切换）';
  setTimeout(()=>{
    const idx = trips.findIndex(t => String(t.no)===focusNo);
    if(idx>=0) focusTrip(idx);
  }, 400);
}

window.addEventListener('load', draw);
</script>
