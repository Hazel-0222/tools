<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 编辑器 · 双栏渲染</title>
<script>
// 主题预载（防闪烁）：优先记忆值（ui-theme，与首页一致），否则跟随系统
(function () {
  try {
    var t = localStorage.getItem('ui-theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<style>
:root { color-scheme: light dark; }
:root:where(:not([data-theme="dark"])) {
  --bg: #fcfcfb; --bg-panel: #f2f2ee; --bg-code: #f6f8fa; --bg-inline: #eff1f3;
  --border: #e1e0d9; --ink: #0b0b0b; --ink-2: #52514e; --ink-muted: #898781;
  --accent: #2a78d6; --btn: #ffffff; --btn-hover: #eef0f5;
  --pre-border: #e3e2da;
}
:root[data-theme="dark"] {
  --bg: #1a1a19; --bg-panel: #232322; --bg-code: #232322; --bg-inline: #2b2b29;
  --border: #2c2c2a; --ink: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
  --accent: #3987e5; --btn: #232322; --btn-hover: #2e2e2c;
  --pre-border: #262624;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --bg: #1a1a19; --bg-panel: #232322; --bg-code: #232322; --bg-inline: #2b2b29;
    --border: #2c2c2a; --ink: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
    --accent: #3987e5; --btn: #232322; --btn-hover: #2e2e2c;
    --pre-border: #262624;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column;
       font-family: "Microsoft YaHei", "微软雅黑", system-ui, sans-serif;
       background: var(--bg); color: var(--ink); }

header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
         padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg-panel); }
header h1 { font-size: 14px; font-weight: 600; margin: 0 8px 0 0; white-space: nowrap; }
button { font: inherit; font-size: 13px; color: var(--ink);
         background: var(--btn); border: 1px solid var(--border); border-radius: 6px;
         padding: 4px 12px; cursor: pointer; }
button:hover { background: var(--btn-hover); }
button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
#btn-mermaid.ok { color: #1a9c4e; }
#btn-mermaid.err { color: #d03b3b; }
#btn-mermaid.load { color: var(--ink-muted); }
label.sync { display: flex; align-items: center; gap: 4px; font-size: 12px;
             color: var(--ink-2); cursor: pointer; white-space: nowrap; }
#status { margin-left: auto; font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
.hint { font-size: 12px; color: var(--ink-muted); white-space: nowrap; }

main { flex: 1; display: flex; min-height: 0; }
#side { width: 40%; min-width: 0;
        display: flex; flex-direction: column; border-right: 1px solid var(--border);
        background: var(--bg-panel); }
#side.hidden { display: none; }
#splitter { position: relative; width: 9px; flex-shrink: 0; cursor: col-resize;
            touch-action: none; background: transparent; transition: background .15s; }
#splitter:hover, #splitter.dragging { background: color-mix(in srgb, var(--accent) 7%, transparent); }
#splitter::before { content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 2px; height: 42px; border-radius: 2px;
            background: var(--ink-muted); opacity: 0; transition: opacity .15s; }
#splitter:hover::before, #splitter.dragging::before { opacity: .85; }

textarea { flex: 1; resize: none; border: 0; outline: 0; padding: 14px;
           font: 14px/1.7 "Cascadia Code", "Consolas", "Microsoft YaHei", "微软雅黑", monospace;
           background: var(--bg); color: var(--ink); tab-size: 2; }
#preview { flex: 1; overflow-y: auto; min-width: 0; padding: 18px 26px 48px;
           font-size: 14px; line-height: 1.75; word-wrap: break-word; }
#preview:focus { outline: none; }

/* ── 预览区 Markdown 排版（GitHub 风，与导出 Word 样式一致） ── */
#preview h1, #preview h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
#preview h1 { font-size: 1.9em; margin: 1em 0 .5em; }
#preview h2 { font-size: 1.5em; margin: 1.2em 0 .5em; }
#preview h3 { font-size: 1.25em; margin: 1.3em 0 .5em; }
#preview h4 { font-size: 1em; margin: 1.1em 0 .5em; }
#preview h5 { font-size: .875em; margin: 1em 0 .5em; }
#preview h6 { font-size: .85em; margin: 1em 0 .5em; color: var(--ink-muted); }
#preview p { margin: .6em 0; }
#preview a { color: var(--accent); }
#preview img { max-width: 100%; display: block; margin: 8px auto; border-radius: 4px; }
#preview hr { border: 0; border-top: 1px solid var(--border); margin: 1.4em 0; }
#preview ul, #preview ol { padding-left: 1.7em; margin: .5em 0; }
#preview li { margin: .2em 0; }
#preview li.task-list-item { list-style: none; margin-left: -1.3em; }
#preview input[type="checkbox"] { accent-color: var(--accent); margin-right: 6px; vertical-align: -1px; }
#preview blockquote { margin: .8em 0; padding: 2px 14px; border-left: 4px solid var(--border);
                      color: var(--ink-2); background: var(--bg-panel); border-radius: 0 6px 6px 0; }
#preview code { font-family: "Cascadia Code", "Consolas", monospace; font-size: .9em;
                background: var(--bg-inline); padding: 2px 5px; border-radius: 4px; }
#preview pre { background: var(--bg-code); border: 1px solid var(--pre-border);
               border-radius: 8px; padding: 12px 14px; overflow-x: auto;
               margin: .8em 0; line-height: 1.55; }
#preview pre code { background: transparent; padding: 0; font-size: 13px; }
#preview table { border-collapse: collapse; margin: .8em 0; display: block; overflow-x: auto; }
#preview th, #preview td { border: 1px solid var(--border); padding: 6px 12px; }
#preview th { background: var(--bg-panel); font-weight: 600; }
#preview tbody tr:nth-child(even) td { background: var(--bg-panel); }
#preview .mermaid-render { text-align: center; margin: 14px 0; }
#preview .mermaid-render svg { max-width: 100%; height: auto; }
#preview .mermaid-render .mermaid-err, #preview .mermaid-render .mermaid-off { text-align: left; }
#preview .mermaid-err { color: #d03b3b; }
#preview .mermaid-off { color: var(--ink-muted); font-size: 12px; }
#preview blockquote .mermaid-render { text-align: left; }

@media (max-width: 760px) {
  main { flex-direction: column; }
  #side { width: 100% !important; max-width: none; height: 45%; border-right: 0; border-bottom: 1px solid var(--border); }
  #splitter { width: 100%; height: 9px; cursor: row-resize; }
  #splitter::before { width: 42px; height: 2px; }
  .hint { display: none; }
  #preview { padding: 14px 18px 40px; }
}
</style>
</head>
<body>

<header>
  <h1>✍️ Markdown 编辑器</h1>
  <button id="btn-new" title="清空草稿">新建</button>
  <button id="btn-sample" title="载入示例文档">示例</button>
  <button id="btn-import" title="导入 .md / .txt 文件 (Ctrl+O)">导入</button>
  <button class="primary" id="btn-export-md" title="导出为 .md 文件 (Ctrl+S)">导出 .md</button>
  <button id="btn-export-word" title="导出为 .docx，样式参照 MD转Word 工具 (Ctrl+Shift+S)">导出 Word</button>
  <button id="btn-img" title="从本地选择图片插入">插入图片</button>
  <button id="btn-copy" title="复制 Markdown 到剪贴板">复制</button>
  <button id="btn-mermaid" title="Mermaid 图表引擎（需联网加载）">🧩 Mermaid…</button>
  <label class="sync" title="滚动右栏跟随左栏"><input type="checkbox" id="syncScroll" checked>同步滚动</label>
  <button id="btn-theme" title="切换明暗主题">🌙</button>
  <input type="file" id="file-md" accept=".md,.markdown,.txt,text/plain" hidden>
  <input type="file" id="file-img" accept="image/*" hidden>
  <span class="hint">Ctrl+S 存 md · Ctrl+Shift+S 转 Word · Ctrl+O 打开 · 粘贴/拖入图片即插入</span>
  <span id="status"></span>
</header>

<main>
  <section id="side">
    <textarea id="editor" spellcheck="false" placeholder="# 标题&#10;&#10;输入 Markdown，右侧实时渲染…"></textarea>
  </section>
  <div id="splitter" title="拖此线调整左栏宽度 · 单击收起/展开"></div>
  <section id="preview" tabindex="-1" aria-label="预览"></section>
</main>

<script>
'use strict';
/* ============================================================
 * Markdown 编辑器 · 双栏实时渲染
 * 左侧写 Markdown，右侧实时渲染。支持图片粘贴/插入（base64 内嵌）、
 * Mermaid 图表、自动存档；导出 .md 或 .docx（GitHub 风格排版）。
 * ============================================================ */

/* ---------------- DOM ---------------- */
const editor     = document.getElementById('editor');
const preview    = document.getElementById('preview');
const statusEl   = document.getElementById('status');
const btnNew     = document.getElementById('btn-new');
const btnSample  = document.getElementById('btn-sample');
const btnImport  = document.getElementById('btn-import');
const btnExportMd  = document.getElementById('btn-export-md');
const btnExportWord = document.getElementById('btn-export-word');
const btnImg     = document.getElementById('btn-img');
const btnCopy    = document.getElementById('btn-copy');
const btnMermaid = document.getElementById('btn-mermaid');
const btnTheme   = document.getElementById('btn-theme');
const syncScroll = document.getElementById('syncScroll');
const fileMd     = document.getElementById('file-md');
const fileImg    = document.getElementById('file-img');
const sideEl     = document.getElementById('side');
const splitEl    = document.getElementById('splitter');

/* ---------------- 状态 ---------------- */
const SAVE_KEY = 'mdedit.draft.v1';
const SAMPLE = [
'# Markdown 编辑器 · 示例',
'',
'## 排版演示',
'- **粗体**、*斜体*、~~删除线~~、`行内代码`、[链接](https://github.com)、<u>下划线</u>',
'- [ ] 待办事项',
'- [x] 已完成事项',
'1. 有序列表一',
'2. 有序列表二',
'',
'## 表格',
'| 列 A | 列 B | 列 C |',
'| ---- | ---- | ---- |',
'| 单元格 | 单元格 | 单元格 |',
'| 单元格 | 单元格 | 单元格 |',
'',
'## 引用与分割线',
'> 这是一段引用文字，左侧有竖线标识。',
'',
'---',
'',
'## 代码块',
'```python',
'def hello():',
'    print("Hello, Word!")',
'```',
'',
'## Mermaid 流程图',
'```mermaid',
'graph LR',
'  A[开始] --> B{判断}',
'  B -->|是| C[完成]',
'  B -->|否| A',
'```',
'',
'## 图片',
'直接粘贴截图（Ctrl+V）或点「插入图片」，图片会以 base64 直接存入 Markdown，离线也能导出 Word。',
''
].join('\n');

let theme = document.documentElement.getAttribute('data-theme') || 'light';
const mqDark = matchMedia('(prefers-color-scheme: dark)');
let mermaidState = 'failed';      // failed | loading | ready
let mmRenderToken = 0, mmId = 0;

/* ---------------- Markdown 渲染 ---------------- */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
const MERMAID_LANGS = new Set(['mermaid', 'mmd', 'flow', 'flowchart', 'graph']);

const renderer = new marked.Renderer();
renderer.code = function ({ text, lang, escaped }) {
  lang = (lang || '').trim();
  if (lang && MERMAID_LANGS.has(lang.toLowerCase())) {
    return '<div class="mermaid-render" data-mermaid="' + encodeURIComponent(text) + '"></div>\n';
  }
  const cls = (lang && /^[a-zA-Z0-9_+-]+$/.test(lang)) ? ' class="language-' + lang + '"' : '';
  return '<pre><code' + cls + '>' + (escaped ? text : escapeHtml(text)) + '</code></pre>\n';
};
function markedParse(src) {
  return marked.parse(src, { renderer, gfm: true, breaks: false, tables: true });
}

/* 预览渲染（输入防抖后调用） */
let renderTimer = null;
function doRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderNow, 160);
}
function renderNow() {
  try {
    preview.innerHTML = markedParse(editor.value);
    document.title = (docTitle() || 'Markdown 编辑器') + ' · 双栏渲染';
    renderMermaid();
    updateStats();
  } catch (err) {
    setStatus('⚠ 渲染出错：' + err.message, '#d03b3b');
  }
}

/* ---------------- Mermaid ---------------- */
function loadMermaid() {
  if (window.mermaid) { mermaidState = 'ready'; return; }
  if (mermaidState === 'loading') return;
  mermaidState = 'loading'; updateMermaidStatus();
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js';
  s.onload = () => { mermaidState = 'ready'; updateMermaidStatus(); renderMermaid(); setStatus('🧩 Mermaid 引擎已加载'); };
  s.onerror = () => { mermaidState = 'failed'; updateMermaidStatus(); renderMermaid(); setStatus('⚠ Mermaid 库加载失败（需联网），图表以源码显示，点击按钮可重试', '#d03b3b'); };
  document.head.appendChild(s);
}
function updateMermaidStatus() {
  btnMermaid.classList.remove('ok', 'err', 'load');
  if (mermaidState === 'ready') {
    btnMermaid.classList.add('ok');
    btnMermaid.textContent = '🧩 Mermaid';
    btnMermaid.title = 'Mermaid 已就绪 · 点击重新加载';
  } else if (mermaidState === 'loading') {
    btnMermaid.classList.add('load');
    btnMermaid.textContent = '⏳ Mermaid…';
    btnMermaid.title = '正在加载 Mermaid 引擎…';
  } else {
    btnMermaid.classList.add('err');
    btnMermaid.textContent = '⛔ Mermaid 离线';
    btnMermaid.title = 'Mermaid 加载失败（离线？）· 点击重试';
  }
}
function fillMermaidFallback(block) {
  const code = decodeURIComponent(block.dataset.mermaid);
  block.classList.add('no-mm');
  block.innerHTML = '<div class="mermaid-off">⛔ Mermaid 库未加载（需联网）· 点击顶部「🧩 Mermaid」重试，或将本块改为代码块显示源码：</div>'
    + '<pre><code>' + escapeHtml(code) + '</code></pre>';
}
async function renderMermaid() {
  const blocks = Array.from(preview.querySelectorAll('.mermaid-render[data-mermaid]'));
  if (mermaidState !== 'ready') { blocks.forEach(fillMermaidFallback); return; }
  const token = ++mmRenderToken;
  mermaid.initialize({ startOnLoad: false, securityLevel: 'loose',
                       theme: theme === 'dark' ? 'dark' : 'default',
                       flowchart: { curve: 'basis' }, fontFamily: 'Microsoft YaHei, 微软雅黑, sans-serif' });
  let n = 0;
  for (const block of blocks) {
    if (token !== mmRenderToken) return;              // 新一轮输入覆盖，放弃旧渲染
    block.classList.remove('no-mm');
    if (block.dataset.rendered === '1') continue;
    try {
      const code = decodeURIComponent(block.dataset.mermaid);
      const { svg } = await mermaid.render('mmd-' + (++mmId), code);
      block.innerHTML = svg;
      block.dataset.rendered = '1';
      block.title = '图表已渲染 · 源码随文档保存';
      n++;
    } catch (err) {
      block.innerHTML = '<div class="mermaid-err">⚠ Mermaid 渲染失败：' + escapeHtml(err.message) + '</div>';
      block.dataset.rendered = '1';
    }
  }
  if (n) setStatus('🧩 已渲染 ' + n + ' 个 Mermaid 图表');
}
btnMermaid.addEventListener('click', loadMermaid);

/* ---------------- 统计 ---------------- */
function updateStats() {
  const t = editor.value;
  const cn = (t.match(/[一-鿿]/g) || []).length;
  const en = (t.match(/[A-Za-z0-9]+/g) || []).length;
  const lines = t ? t.split('\n').length : 0;
  const imgs = preview.querySelectorAll('img').length;
  const mmd = preview.querySelectorAll('.mermaid-render[data-mermaid]').length;
  let s = lines + ' 行 · ' + t.length + ' 字（中文 ' + cn + ' · 英文 ' + en + '）';
  if (imgs) s += ' · 🖼 ' + imgs; if (mmd) s += ' · 📊 ' + mmd;
  statusEl.style.color = '';
  statusEl.textContent = s;
}
function setStatus(msg, color) {
  statusEl.textContent = msg;
  statusEl.style.color = color || '';
}

/* ---------------- 标题 / 存档 ---------------- */
function docTitle() {
  const m = editor.value.match(/^#\s+(.+)$/m);
  return m ? m[1].trim() : '';
}
function sanitizeName(s) {
  return (s || 'Markdown 编辑器').replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim() || 'Markdown 编辑器';
}
let saveTimer = null;
function saveNow(msg) {
  try { localStorage.setItem(SAVE_KEY, editor.value); } catch (err) {}
  if (msg) statusEl.textContent = msg;
}

/* ---------------- 导入 / 导出 ---------------- */
function exportMarkdown() {
  const name = sanitizeName(docTitle());
  const blob = new Blob([editor.value], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '.md';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  statusEl.textContent = '已导出 ' + a.download;
}
btnExportMd.addEventListener('click', exportMarkdown);

/* --- Word 导出（GitHub 风排版，样式与 WORD_MD转Word.py 保持一致） --- */
const WORD_CSS = [
'body{font-family:"微软雅黑","Microsoft YaHei",sans-serif;font-size:10pt;color:#24292F;line-height:1.0;margin:0}',
'h1{font-size:20pt;font-weight:bold;border-bottom:1px solid #DFE2E5;padding-bottom:4pt;margin:0 0 8pt}',
'h2{font-size:16pt;font-weight:bold;border-bottom:1px solid #DFE2E5;padding-bottom:4pt;margin:14pt 0 8pt}',
'h3{font-size:14pt;font-weight:bold;margin:16pt 0 8pt}',
'h4{font-size:12pt;font-weight:bold;margin:10pt 0 6pt}',
'h5{font-size:10pt;font-weight:bold;margin:8pt 0 4pt}',
'h6{font-size:10pt;font-weight:bold;color:#6A737D;margin:8pt 0 4pt}',
'p{margin:0 0 6pt}',
'ul,ol{margin:0 0 6pt;padding-left:22pt}',
'li{margin:2pt 0}',
'code{font-family:"微软雅黑","Microsoft YaHei",sans-serif;font-size:10pt;background-color:#EFF1F3;padding:1pt 3pt}',
'pre{background-color:#F6F8FA;border:1px solid #DFE2E5;border-radius:3pt;padding:8pt;margin:6pt 0}',
'pre code{background:transparent;padding:0;font-size:10pt}',

'img{max-width:100%}',
'a{color:#0969DA}',
'input[type=checkbox]{margin-right:4pt}'
].join('\n');

function svgToPng(svg, scale) {
  return new Promise(resolve => {
    try {
      // mermaid 默认 useMaxWidth：根节点常是 width="100%"、无 height 属性。
      // 若直接读属性会拿 NaN/100 回退成 800×600 → 导出图被压扁拉长。
      // 一律以 viewBox（图的真实包围盒）为尺寸源，保证纵横比与画面一致。
      const vb = (svg.getAttribute('viewBox') || '').trim();
      const m = vb.split(/[\s,]+/).map(parseFloat).filter(n => !isNaN(n));
      const w = (m.length === 4 && m[2] > 0) ? m[2] * scale : (parseFloat(svg.getAttribute('width')) || 800) * scale;
      const h = (m.length === 4 && m[3] > 0) ? m[3] * scale : (parseFloat(svg.getAttribute('height')) || 600) * scale;
      const cw = Math.max(1, Math.round(w)), ch = Math.max(1, Math.round(h));
      // 克隆 SVG 并写入与 viewBox 同比例的像素尺寸：浏览器按此固有尺寸解码，杜绝拉伸
      const cl = svg.cloneNode(true);
      cl.removeAttribute('style');
      cl.setAttribute('width', cw);
      cl.setAttribute('height', ch);
      cl.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(cl));
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = () => resolve(null);
      img.src = url;
    } catch (err) { resolve(null); }
  });
}

async function buildWordHtml() {
  // 确保 mermaid 已渲染完成（用户可能赶在图表加载完前就点了导出）
  if (mermaidState === 'ready') await renderMermaid();
  const tmp = document.createElement('div');
  tmp.innerHTML = markedParse(editor.value);
  // 处理 mermaid 块：已渲染 → SVG 转 PNG 内嵌；未渲染 → 保留源码代码块
  for (const block of Array.from(tmp.querySelectorAll('.mermaid-render[data-mermaid]'))) {
    const code = decodeURIComponent(block.dataset.mermaid);
    const live = Array.from(preview.querySelectorAll('.mermaid-render[data-mermaid]'))
                      .find(x => x.dataset.mermaid === block.dataset.mermaid);
    let png = null;
    if (live && live.querySelector('svg')) png = await svgToPng(live.querySelector('svg'), 2);
    if (png) {
      const p = document.createElement('p');
      p.setAttribute('style', 'text-align:center;margin:8pt 0');
      const img = document.createElement('img');
      img.src = png;
      img.setAttribute('style', 'max-width:90%');
      p.appendChild(img);
      block.replaceWith(p);
    } else {
      const pre = document.createElement('pre');
      pre.appendChild(document.createElement('code')).textContent = code;
      block.replaceWith(pre);
    }
  }
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' + WORD_CSS + '</style>'
       + '</head><body>' + tmp.innerHTML + '</body></html>';
}

async function exportWord() {
  if (!window.htmlDocx) { statusEl.textContent = '⚠ Word 转换引擎缺失'; return; }
  statusEl.textContent = '⏳ 正在生成 Word…';
  try {
    const html = await buildWordHtml();
    // 页边距：上下 2cm、左右 2.5cm（与 MD转Word.py 一致）
    const blob = window.htmlDocx.asBlob(html, {
      margins: { top: 1134, bottom: 1134, left: 1417, right: 1417 }
    });
    const now = new Date();
    const date = String(now.getFullYear()) + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
    const name = date + '_' + sanitizeName(docTitle()) + '_转Word';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name + '.docx';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    statusEl.textContent = '已导出 ' + a.download + '（' + Math.round(blob.size / 1024) + ' KB）';
  } catch (err) {
    statusEl.textContent = '⚠ Word 导出失败：' + err.message;
    console.error(err);
  }
}
btnExportWord.addEventListener('click', exportWord);

/* ---------------- 图片插入 ---------------- */
function insertAtCursor(text) {
  editor.focus();
  if (document.execCommand) { document.execCommand('insertText', false, text); return; }
  const s = editor.selectionStart, e = editor.selectionEnd;
  editor.value = editor.value.slice(0, s) + text + editor.value.slice(e);
  editor.selectionStart = editor.selectionEnd = s + text.length;
}
function readImageFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const sep = reader.result.indexOf(',');
    const mime = sep > -1 ? reader.result.slice(5, sep) : 'image/png';
    const name = (file.name ? file.name.replace(/\.[^.]+$/, '') : '图片');
    const md = '\n![' + name.replace(/[[\]()]/g, '-') + '](' + reader.result + ')\n';
    insertAtCursor(md);
    editor.dispatchEvent(new Event('input'));
    statusEl.textContent = '已插入图片 ' + name + '（' + Math.round(reader.result.length / 3 / 1024) + ' KB base64）';
  };
  reader.readAsDataURL(file);
}
btnImg.addEventListener('click', () => fileImg.click());
fileImg.addEventListener('change', () => {
  const f = fileImg.files[0];
  fileImg.value = '';
  if (f) readImageFile(f);
});
editor.addEventListener('paste', e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items) {
    if (it.type && it.type.startsWith('image/')) {
      e.preventDefault();
      readImageFile(it.getAsFile());
      return;
    }
  }
});
editor.addEventListener('dragover', e => {
  if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) e.preventDefault();
});
editor.addEventListener('drop', e => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  const f = Array.from(e.dataTransfer.files).find(x => x.type.startsWith('image/'));
  if (f) { e.preventDefault(); readImageFile(f); }
});

/* ---------------- 主题 ---------------- */
function applyTheme(t, persist) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  btnTheme.textContent = t === 'dark' ? '☀️' : '🌙';
  if (persist !== false) { try { localStorage.setItem('ui-theme', t); } catch (err) {} }
  // mermaid 图表主题跟随：清掉已渲染标记，用新主题重绘
  preview.querySelectorAll('.mermaid-render[data-mermaid]').forEach(el => { el.dataset.rendered = ''; });
  renderMermaid();
}
btnTheme.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
// 未手动选过主题时，跟随系统明暗切换
mqDark.addEventListener('change', () => {
  try {
    const t = localStorage.getItem('ui-theme');
    if (t !== 'light' && t !== 'dark') applyTheme(mqDark.matches ? 'dark' : 'light', false);
  } catch (err) {}
});

/* ---------------- 键盘快捷键 ---------------- */
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 's') {
    if (e.shiftKey) { e.preventDefault(); exportWord(); }
    else { e.preventDefault(); exportMarkdown(); }
  } else if (mod && e.key.toLowerCase() === 'o') {
    e.preventDefault(); fileMd.click();
  } else if (e.key === 'Tab' && !mod && document.activeElement === editor) {
    e.preventDefault();
    document.execCommand('insertText', false, '  ');
  }
});

/* ---------------- 工具栏 ---------------- */
function loadText(md, msg) {
  editor.value = md;
  renderNow();
  saveNow(msg);
}
btnNew.addEventListener('click', () => loadText('# 未命名\n', '已新建空白文档'));
btnSample.addEventListener('click', () => loadText(SAMPLE, '已载入示例'));
btnImport.addEventListener('click', () => fileMd.click());
fileMd.addEventListener('change', () => {
  const f = fileMd.files[0];
  fileMd.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => loadText(rd.result, '已导入 ' + f.name);
  rd.readAsText(f, 'utf-8');
});
btnCopy.addEventListener('click', () => {
  navigator.clipboard.writeText(editor.value).then(
    () => statusEl.textContent = '已复制 Markdown',
    () => statusEl.textContent = '复制失败，请手动 Ctrl+C'
  );
});

/* ---------------- 自动保存 & 同步滚动 ---------------- */
editor.addEventListener('input', () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveNow('已自动保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false })), 400);
  doRender();
});
editor.addEventListener('scroll', () => {
  if (!syncScroll.checked || !preview.scrollHeight) return;
  const frac = editor.scrollTop === 0 ? 0
    : editor.scrollTop / (editor.scrollHeight - editor.clientHeight);
  preview.scrollTop = frac * (preview.scrollHeight - preview.clientHeight);
});

/* ---------------- 左栏宽度（分隔线拖拽 + 记忆） ---------------- */
let sideHidden = false, sideW = null;
try {
  sideHidden = localStorage.getItem('mdedit.side.hidden') === '1';
  const w = parseFloat(localStorage.getItem('mdedit.side.width'));
  if (w && w >= 120 && w <= 700) sideW = w;
} catch (err) {}
function applySide() {
  sideEl.classList.toggle('hidden', sideHidden);
  sideEl.style.width = (sideHidden || !sideW) ? '' : sideW + 'px';
}
function toggleSide() {
  sideHidden = !sideHidden;
  try { localStorage.setItem('mdedit.side.hidden', sideHidden ? '1' : '0'); } catch (err) {}
  applySide();
}
const SIDE_MIN = 120, SIDE_MAX = 700, SIDE_COLLAPSE = 150;
let sideDrag = null;
splitEl.addEventListener('pointerdown', e => {
  sideDrag = { ptr: e.pointerId, x: e.clientX, w0: sideEl.getBoundingClientRect().width, moved: false, narrow: window.innerWidth <= 760 };
  splitEl.classList.add('dragging');
  try { splitEl.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
splitEl.addEventListener('pointermove', e => {
  if (!sideDrag) return;
  if (!sideDrag.moved && Math.abs(e.clientX - sideDrag.x) > 4) sideDrag.moved = true;
  if (!sideDrag.moved || sideDrag.narrow) return;
  const w = Math.max(SIDE_MIN, Math.min(SIDE_MAX, sideDrag.w0 + (e.clientX - sideDrag.x)));
  if (sideHidden) { sideHidden = false; sideEl.classList.remove('hidden'); }
  sideEl.style.width = w + 'px';
});
function sideUp() {
  if (!sideDrag) return;
  const d = sideDrag;
  splitEl.classList.remove('dragging');
  sideDrag = null;
  if (d.narrow || !d.moved) { toggleSide(); return; }
  const w = parseFloat(sideEl.style.width);
  if (!isNaN(w) && w < SIDE_COLLAPSE) {
    sideHidden = true; sideW = null;
    try { localStorage.removeItem('mdedit.side.width'); } catch (err) {}
    applySide();
  } else if (!isNaN(w)) {
    sideW = Math.round(w);
    try { localStorage.setItem('mdedit.side.width', sideW); } catch (err) {}
  }
}
splitEl.addEventListener('pointerup', sideUp);
splitEl.addEventListener('pointercancel', sideUp);
applySide();

/* ---------------- 报错可见化 ---------------- */
window.addEventListener('error', ev => {
  const m = ev && ev.message ? ev.message : String(ev);
  statusEl.textContent = '⚠ 脚本出错：' + m;
});

/* ---------------- 启动 ---------------- */
let saved = null;
try { saved = localStorage.getItem(SAVE_KEY); } catch (err) {}
editor.value = (saved != null && saved !== '') ? saved : SAMPLE;
renderNow();
loadMermaid();
setTimeout(() => {
  statusEl.textContent = '自动保存已开启 '
    + (saved != null && saved !== '' ? '· 已恢复上次草稿' : '');
}, 150);
</script>
