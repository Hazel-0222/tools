<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
// 主题预载（防闪烁）：与首页共用 localStorage['ui-theme']
(function () {
    try {
        var t = localStorage.getItem('ui-theme');
        if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Excel 目录生成器 - Tools</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root {
    /* ── 与工具合集首页保持一致的设计 Token ── */
    --bg: #eef0fb;
    --page-bg-image:
        radial-gradient(900px 520px at 10% -10%, rgba(0,113,227,.145), transparent 60%),
        radial-gradient(760px 480px at 90% 0%, rgba(122,92,255,.125), transparent 60%),
        radial-gradient(840px 560px at 50% 108%, rgba(255,154,186,.105), transparent 60%),
        linear-gradient(165deg, #e7ecfb 0%, #eee9fc 55%, #f6ecf2 100%);
    --card-bg: #ffffff;
    --input-bg: rgba(255,255,255,0.85);
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --border: #e2e2e7;
    --primary: #0071e3;
    --primary-soft: #e8f2fe;
    --focus-ring: rgba(0,113,227,0.22);
    --hover-bg: rgba(0,0,0,0.045);
    --success: #34a853;
    --danger: #e53935;
    --btn-bg: #0071e3;
    --btn-fg: #ffffff;
    --btn2-bg: #e5e5ea;
    --btn2-fg: #1d1d1f;
    --btn-shadow:
        0 1px 2px rgba(0,0,0,0.14),
        0 3px 10px -1px rgba(13,25,60,0.16);
    --btn-shadow-hover:
        0 2px 4px rgba(0,0,0,0.16),
        0 6px 18px -2px rgba(13,25,60,0.24);
    --log-info: #0071e3;
    --log-success: #1a7f37;
    --log-error: #d93025;
    --log-warn: #9a6700;
    --panel-border: rgba(0,0,0,0.045);
    --hd-veil: rgba(255,255,255,0.65);
    --panel-shadow:
        0 2px 8px rgba(13,25,60,0.04),
        0 24px 56px -16px rgba(13,25,60,0.14);
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-hover: 0 8px 24px rgba(0,0,0,0.12);
    --mono: "Cascadia Code", "Fira Code", "Consolas", "Courier New", monospace;
}
[data-theme="dark"] {
    --bg: #0f1016;
    --page-bg-image:
        radial-gradient(900px 520px at 10% -10%, rgba(80,140,255,.13), transparent 60%),
        radial-gradient(760px 480px at 90% 0%, rgba(139,124,255,.10), transparent 60%),
        radial-gradient(840px 560px at 50% 108%, rgba(255,140,180,.06), transparent 60%),
        linear-gradient(165deg, #12131f 0%, #0f0f1a 55%, #150f1b 100%);
    --card-bg: #1a1b22;
    --input-bg: #14151c;
    --text: #ededf1;
    --text-secondary: #9a9ba5;
    --border: #2a2b33;
    --primary: #5ea2f5;
    --primary-soft: rgba(94,162,245,0.16);
    --focus-ring: rgba(94,162,245,0.30);
    --hover-bg: rgba(255,255,255,0.06);
    --success: #4caf7d;
    --danger: #f0716a;
    --btn-bg: #5ea2f5;
    --btn-fg: #1d1d1f;
    --btn2-bg: rgba(229,229,234,0.14);
    --btn2-fg: #ededf1;
    --btn-shadow:
        0 1px 2px rgba(0,0,0,0.4),
        0 4px 14px -2px rgba(0,0,0,0.5);
    --btn-shadow-hover:
        0 2px 4px rgba(0,0,0,0.45),
        0 8px 22px -2px rgba(0,0,0,0.6);
    --log-info: #4fc3f7;
    --log-success: #81c784;
    --log-error: #ef5350;
    --log-warn: #ffb74d;
    --panel-border: #2a2b33;
    --hd-veil: rgba(255,255,255,0.05);
    --panel-shadow:
        0 8px 20px rgba(0,0,0,0.34),
        0 32px 64px -16px rgba(0,0,0,0.42);
    --shadow: 0 1px 2px rgba(0,0,0,0.5);
    --shadow-hover: 0 8px 24px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    background-image: var(--page-bg-image);
    background-attachment: fixed;
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 36px 20px 60px;
    transition: background-color 0.3s, color 0.3s;
}
.page { max-width: 720px; margin: 0 auto; }

/* ── 顶栏：返回链接 + 主题切换 ── */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}
.back-link {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 6px 10px 6px 0;
    transition: color 0.15s;
}
.back-link:hover { color: var(--primary); }
.theme-toggle {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--input-bg);
    font-size: 16px; cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
}
.theme-toggle:hover { transform: scale(1.08); }

/* ── 面板 ── */
.panel {
    --panel-pad: 32px;
    --panel-r: 18px;
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: var(--panel-shadow);
    padding: var(--panel-pad);
}
.panel .hd {
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 0;
    padding-bottom: 14px;
    margin-bottom: 18px;
}
.panel .hd::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: calc(-1 * var(--panel-pad));
    left: calc(-1 * var(--panel-pad));
    right: calc(-1 * var(--panel-pad));
    bottom: 0;
    background:
        linear-gradient(var(--hd-veil), var(--hd-veil)),
        var(--page-bg-image);
    border-radius: var(--panel-r) var(--panel-r) 0 0;
}
.panel .hd .ico { font-size: 34px; line-height: 1; flex-shrink: 0; }
.panel .hd .hdtext { min-width: 0; }
.panel h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.3px;
}
.panel .subtitle {
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 3px;
    line-height: 1.55;
}

/* ── 拖拽区 ── */
.drop-zone {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1.5px dashed var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
    background: var(--input-bg);
    margin-bottom: 14px;
    user-select: none;
}
.drop-zone:hover,
.drop-zone.dragover {
    border-color: var(--primary);
    background: var(--primary-soft);
    box-shadow: 0 0 0 4px rgba(0,113,227,0.10);
}
.drop-zone.has-file {
    border-color: var(--success);
    border-style: solid;
    background: var(--input-bg);
}
.drop-zone.dragover.has-file { border-color: var(--primary); background: var(--primary-soft); }
.drop-zone .icon { font-size: 36px; line-height: 1; flex-shrink: 0; }
.drop-zone .dtxt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.drop-zone .title { font-size: 14px; font-weight: 500; }
.drop-zone .hint { font-size: 12px; color: var(--text-secondary); }

/* ── 文件信息条 ── */
.file-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 14px;
}
.file-bar .fb-icon { font-size: 16px; flex-shrink: 0; }
.file-bar .fb-name {
    flex: 1;
    font-weight: 500;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.file-bar .fb-size { font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
.file-bar .fb-remove {
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 16px;
    line-height: 1;
    flex-shrink: 0;
    padding: 2px 6px;
    border-radius: 6px;
    transition: all 0.15s;
    border: none;
    background: none;
}
.file-bar .fb-remove:hover { color: var(--danger); background: rgba(229,57,53,0.12); }

/* ── 表单 ── */
.form-group { margin-bottom: 14px; }
.form-group label {
    display: block;
    font-weight: 500;
    font-size: 13px;
    margin-bottom: 6px;
}
.form-group input {
    width: 100%;
    padding: 9px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    caret-color: var(--primary);
    background: var(--input-bg);
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s, background 0.3s, color 0.3s;
}
.form-group input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--focus-ring);
}
.form-group .sublabel { font-size: 12px; color: var(--text-secondary); margin-top: 4px; font-weight: 400; }

/* ── 按钮 ── */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 18px;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    box-shadow: var(--btn-shadow);
    transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.1s;
    white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
    background: var(--btn-bg);
    color: var(--btn-fg);
    width: 100%;
    padding: 12px;
    font-size: 14px;
    transition: background-color 0.2s, box-shadow 0.2s, transform 0.1s, border-color 0.2s;
}
.btn-primary:hover:not(:disabled),
.btn-download:hover { box-shadow: var(--btn-shadow-hover); }
.btn-primary:disabled {
    background: var(--border);
    color: var(--text-secondary);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}
.btn-outline {
    background: var(--btn2-bg);
    color: var(--btn2-fg);
    border: none;
}
.btn-outline:hover:not(:disabled) {
    background: linear-gradient(var(--hover-bg), var(--hover-bg)), var(--btn2-bg);
    box-shadow: var(--btn-shadow-hover);
}
.btn-download {
    background: var(--btn-bg);
    color: var(--btn-fg);
    transition: background-color 0.2s, box-shadow 0.2s, transform 0.1s, border-color 0.2s;
}

.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.btn-row .btn { flex: 1; }

/* ── 日志区 ── */
.log-area {
    background: var(--input-bg);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    max-height: 200px;
    overflow-y: auto;
    margin-top: 14px;
    min-height: 40px;
    border: 1px solid var(--border);
}
.log-area:empty::after { content: "等待操作…"; color: var(--text-secondary); }
.log-line { margin: 0; }
.log-line.info { color: var(--log-info); }
.log-line.success { color: var(--log-success); }
.log-line.error { color: var(--log-error); }
.log-line.warn { color: var(--log-warn); }

/* ── 状态栏 ── */
.status-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-top: 12px;
    margin-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-secondary);
}
.status-bar .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success); flex-shrink: 0;
}
.status-bar .dot.busy {
    background: #f5a623;
    animation: pulse 1s infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.hidden { display: none !important; }

/* ── 响应式 ── */
@media (max-width: 560px) {
    body { padding: 24px 14px 44px; }
    .panel { --panel-pad: 20px; --panel-r: 14px; padding: var(--panel-pad); border-radius: 14px; }
    .panel h1 { font-size: 20px; }
    .drop-zone { padding: 18px 14px; }
    .btn-row { flex-direction: column; }
}
</style>
</head>
<body>

<div class="page">
    <!-- 顶栏 -->
    <div class="topbar">
        <a class="back-link" href="../../index.html">← 返回工具集</a>
        <button class="theme-toggle" id="themeBtn" type="button" aria-label="切换明暗模式">🌙</button>
    </div>

    <!-- 主面板 -->
    <div class="panel">
        <div class="hd">
            <div class="ico">📊</div>
            <div class="hdtext">
                <h1>Excel 目录生成器</h1>
                <p class="subtitle">选择 Excel 文件，自动生成带超链接的目录页 · 重命名 sheet 后链接自动更新</p>
            </div>
        </div>

        <!-- 拖拽区 -->
        <div class="drop-zone" id="dropZone">
            <div class="icon">📂</div>
            <div class="dtxt">
                <div class="title">拖拽 Excel 文件到此处</div>
                <div class="hint">或点击选择 · 支持 .xlsx / .xlsm / .xltx / .xltm</div>
            </div>
            <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xltx,.xltm" hidden>
        </div>

        <!-- 文件信息条 -->
        <div class="file-bar hidden" id="fileBar">
            <span class="fb-icon">📄</span>
            <span class="fb-name" id="fileName"></span>
            <span class="fb-size" id="fileSize"></span>
            <button class="fb-remove" id="btnRemove" title="移除文件">✕</button>
        </div>

        <!-- 表单 -->
        <div class="form-group">
            <label for="tocName">目录页名称</label>
            <input type="text" id="tocName" value="目录" maxlength="31" placeholder="目录">
            <div class="sublabel">默认"目录"。工作表名最长 31 个字符</div>
        </div>

        <!-- 操作按钮 -->
        <button class="btn btn-primary" id="btnGenerate" disabled>生成目录</button>

        <div class="btn-row hidden" id="resultRow">
            <button class="btn btn-download" id="btnDownload">下载结果文件</button>
            <button class="btn btn-outline" id="btnReset">重新开始</button>
        </div>

        <!-- 日志 -->
        <div class="log-area" id="logArea"></div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">就绪</span>
        </div>
    </div>
</div>

<script>
(function () {
    // ═══════════════════════════════════════════════
    //  DOM 引用
    // ═══════════════════════════════════════════════
    const $ = (sel) => document.querySelector(sel);

    const dropZone   = $('#dropZone');
    const fileInput  = $('#fileInput');
    const fileBar    = $('#fileBar');
    const fileName   = $('#fileName');
    const fileSize   = $('#fileSize');
    const btnRemove  = $('#btnRemove');
    const tocName    = $('#tocName');
    const btnGen     = $('#btnGenerate');
    const resultRow  = $('#resultRow');
    const btnDownload= $('#btnDownload');
    const btnReset   = $('#btnReset');
    const logArea    = $('#logArea');
    const statusDot  = $('#statusDot');
    const statusText = $('#statusText');
    const themeBtn   = $('#themeBtn');

    // ═══════════════════════════════════════════════
    //  明暗模式（与首页共用 localStorage['ui-theme']）
    // ═══════════════════════════════════════════════
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
    themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        try { localStorage.setItem('ui-theme', next); } catch (e) {}
        applyTheme(next);
    });

    // ═══════════════════════════════════════════════
    //  设置记忆
    // ═══════════════════════════════════════════════
    function loadSettings() {
        const saved = localStorage.getItem('excelToc_settings');
        if (saved) {
            try {
                const settings = JSON.parse(saved);
                if (settings.tocName) tocName.value = settings.tocName;
            } catch (e) {}
        }
    }
    function saveSettings() {
        const settings = { tocName: tocName.value };
        localStorage.setItem('excelToc_settings', JSON.stringify(settings));
    }
    tocName.addEventListener('input', saveSettings);

    // ═══════════════════════════════════════════════
    //  状态
    // ═══════════════════════════════════════════════
    let selectedFile = null;    // File 对象
    let resultBuf = null;       // 注入后的完整文件字节（不离线的 Uint8Array）
    let resultExt = 'xlsx';     // 输出扩展名

    const SUPPORTED_EXT = ['.xlsx', '.xlsm', '.xltx', '.xltm'];

    // ═══════════════════════════════════════════════
    //  日志
    // ═══════════════════════════════════════════════
    function log(msg, cls = 'info') {
        const p = document.createElement('p');
        p.className = 'log-line ' + cls;
        p.textContent = msg;
        logArea.appendChild(p);
        logArea.scrollTop = logArea.scrollHeight;
    }

    function clearLog() {
        logArea.innerHTML = '';
    }

    function setStatus(text, busy = false) {
        statusText.textContent = text;
        statusDot.className = busy ? 'dot busy' : 'dot';
    }

    // ═══════════════════════════════════════════════
    //  文件大小格式化
    // ═══════════════════════════════════════════════
    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    // ═══════════════════════════════════════════════
    //  文件选择
    // ═══════════════════════════════════════════════
    function selectFile(file) {
        if (!file) return;

        const ext = '.' + file.name.split('.').pop().toLowerCase();
        if (!SUPPORTED_EXT.includes(ext)) {
            alert('不支持的文件格式！\n请使用 .xlsx、.xlsm、.xltx、.xltm 格式的文件。');
            return;
        }

        selectedFile = file;
        fileName.textContent = file.name;
        fileSize.textContent = formatSize(file.size);

        dropZone.classList.add('has-file');
        fileBar.classList.remove('hidden');
        btnGen.disabled = false;
        resultRow.classList.add('hidden');
        resultBuf = null;
        clearLog();
        log('📥 已选择：' + file.name);
        setStatus('已选择文件：' + file.name);
    }

    function clearFile() {
        selectedFile = null;
        resultBuf = null;
        fileInput.value = '';
        fileName.textContent = '';
        fileSize.textContent = '';
        dropZone.classList.remove('has-file');
        fileBar.classList.add('hidden');
        btnGen.disabled = true;
        resultRow.classList.add('hidden');
        clearLog();
        setStatus('就绪');
    }

    // ── 事件绑定 ──
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) selectFile(fileInput.files[0]);
    });

    btnRemove.addEventListener('click', (e) => {
        e.stopPropagation();
        clearFile();
    });

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            selectFile(e.dataTransfer.files[0]);
        }
    });

    // ═══════════════════════════════════════════════
    //  核心：生成目录
    // ═══════════════════════════════════════════════
    function buildFormula(sheetName) {
        // 转义单引号：' → ''
        const escaped = sheetName.replace(/'/g, "''");

        // 动态提取工作表名的公式片段
        // CELL("filename", ref) 返回: C:\path\[Book.xlsx]SheetName
        // REPLACE(..., 1, FIND("]", ...), "") 去掉路径和文件名，只保留工作表名
        const extract =
            `REPLACE(CELL("filename",'${escaped}'!A1),` +
            `1,FIND("]",CELL("filename",'${escaped}'!A1)),"")`;

        // 完整 HYPERLINK 公式
        // 链接目标: "#'" & sheetname & "'!A1"  （始终用单引号包裹，兼容含空格/特殊字符的表名）
        // 显示文字: sheetname（动态，随重命名自动更新）
        return `=HYPERLINK("#'"&${extract}&"'!A1", ${extract})`;
    }

    function generateToc() {
        if (!selectedFile) {
            alert('请先选择一个 Excel 文件。');
            return;
        }

        const sheetName = tocName.value.trim() || '目录';
        if (sheetName.length > 31) {
            alert('工作表名称不能超过 31 个字符！');
            return;
        }

        clearLog();
        log('🔍 开始生成目录...');
        log('  文件：' + selectedFile.name);
        log('  目录名：' + sheetName);
        setStatus('处理中…', true);
        btnGen.disabled = true;
        btnGen.textContent = '⏳ 处理中…';

        // 使用 setTimeout 让 UI 先更新
        setTimeout(() => {
            try {
                doGenerate(sheetName);
            } catch (err) {
                log('❌ 生成失败：' + err.message, 'error');
                setStatus('失败', false);
                btnGen.disabled = false;
                btnGen.textContent = '⚡ 生成目录';
            }
        }, 50);
    }

    function doGenerate(sheetName) {
        // 读取文件
        const reader = new FileReader();
        reader.onload = async function (e) {
            try {
                const buf = new Uint8Array(e.target.result);
                log('🔬 手术式注入：只在压缩包里新增目录页，原有内容逐字节保留', 'info');

                const res = await injectToc(buf, sheetName);
                resultBuf = res.buffer;

                resultExt = selectedFile.name.split('.').pop().toLowerCase();

                log('✅ 目录生成成功！共 ' + res.sheetCount + ' 个超链接', 'success');
                log('ℹ 目录页文字已写入显示值，打开即见；重命名工作表后链接自动跟随（重算后生效）', 'info');
                if (res.removed.length) log('ℹ 已替换旧的目录页', 'warn');
                if (res.plain) log('⚠ 样式注入失败，目录页使用默认样式（内容不受影响）', 'warn');
                if (resultExt === 'xlsm' || resultExt === 'xltm') {
                    log('✅ VBA 宏已保留（不再二次序列化）', 'success');
                }
                log('✅ 填色 / 批注 / 条件格式 / 图片图表等原有内容全部保留', 'success');
                setStatus('完成 — 共 ' + res.sheetCount + ' 个工作表');
                btnGen.textContent = '⚡ 生成目录';
                btnGen.disabled = false;
                resultRow.classList.remove('hidden');

            } catch (err) {
                log('❌ 处理失败：' + err.message, 'error');
                console.error(err);
                setStatus('失败');
                btnGen.disabled = false;
                btnGen.textContent = '⚡ 生成目录';
            }
        };

        reader.onerror = function () {
            log('❌ 读取文件失败', 'error');
            setStatus('读取失败');
            btnGen.disabled = false;
            btnGen.textContent = '⚡ 生成目录';
        };

        reader.readAsArrayBuffer(selectedFile);
    }

    // ═══════════════════════════════════════════════
    //  手术式注入：解析 ZIP 容器，新增目录页 part；
    //  其余所有 part（含原工作表、样式、图片、宏）逐字节不动
    // ═══════════════════════════════════════════════
    function xmlEsc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function incTagCount(xml, tag, delta) {
        const re = new RegExp('(<' + tag + '\\s+count=")(\\d+)(")');
        if (!re.test(xml)) return null;
        return xml.replace(re, function (all, a, n, c) {
            return a + (parseInt(n, 10) + delta) + c;
        });
    }

    // 返回 { buffer: Uint8Array, sheetCount, removed, plain }
    async function injectToc(buffer, tocName) {
        const zip = await JSZip.loadAsync(buffer);

        const wbXmlRaw = zip.file('xl/workbook.xml');
        const relsRaw = zip.file('xl/_rels/workbook.xml.rels');
        const ctRaw = zip.file('[Content_Types].xml');
        if (!wbXmlRaw || !relsRaw || !ctRaw) throw new Error('不是有效的 .xlsx/.xlsm 文件（缺少关键部件）');

        let wbXml = await wbXmlRaw.async('string');
        let relsXml = await relsRaw.async('string');
        let ctXml = await ctRaw.async('string');

        // ── 解析现有 sheet 列表 & 关系 ──
        const sheets = [];
        const sheetRe = /<sheet\b([^>]*?)\/?>/g;
        let m;
        while ((m = sheetRe.exec(wbXml))) {
            const attrs = m[1];
            const name = /name="([^"]*)"/.exec(attrs);
            const sheetId = /sheetId="([^"]*)"/.exec(attrs);
            const rid = /r:id="([^"]*)"/.exec(attrs);
            if (name) sheets.push({ name: name[1], sheetId: sheetId ? sheetId[1] : '', rid: rid ? rid[1] : '', raw: m[0] });
        }

        const ridToTarget = {};
        const relRe = /<Relationship\b([^>]*?)\/?>/g;
        while ((m = relRe.exec(relsXml))) {
            const id = /Id="([^"]*)"/.exec(m[1]);
            const target = /Target="([^"]*)"/.exec(m[1]);
            if (id && target) ridToTarget[id[1]] = target[1];
        }

        // ── 删除同名的旧目录页（若存在） ──
        let names = sheets.map((s) => s.name);
        const removed = [];
        const toRemove = sheets.filter((s) => s.name === tocName);
        for (const s of toRemove) {
            wbXml = wbXml.replace(s.raw, '');
            relsXml = relsXml.replace(new RegExp('<Relationship\\b[^>]*\\bId="' + s.rid + '"[^>]*/?>', 'g'), '');
            const tgt = ridToTarget[s.rid];
            if (tgt) {
                const norm = tgt.replace(/^\/+/, '');
                removed.push(norm);
                zip.remove(norm);
                const rel2 = norm.replace(/^(.+\/)?([^/]+)$/, '$1_rels/$2.rels');
                if (zip.file(rel2)) zip.remove(rel2);
                ctXml = ctXml.replace(new RegExp('<Override[^>]*PartName="/?' + norm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '"[^>]*/?>', 'g'), '');
            }
            names = names.filter((n) => n !== s.name);
        }

        // ── 计算新的 sheet 编号 / rId ──
        const maxSheetNum = Object.values(ridToTarget).reduce((mx, t) => {
            const mm = /worksheets\/sheet(\d+)\.xml/.exec(t);
            return mm ? Math.max(mx, parseInt(mm[1], 10)) : mx;
        }, 0);
        const newSheetNum = maxSheetNum + 1;
        const newSheetPath = 'xl/worksheets/sheet' + newSheetNum + '.xml';
        const maxRid = Object.keys(ridToTarget).reduce((mx, id) => {
            const mm = /^rId(\d+)$/.exec(id);
            return mm ? Math.max(mx, parseInt(mm[1], 10)) : mx;
        }, 0);
        const newRid = 'rId' + (maxRid + 1);

        // ── 样式：向 styles.xml 追加 2 字体 + 1 填色 + 1 边框 + 3 cellXf ──
        let S = { xh: 0, xc: 0, xl: 0 };
        let stylesXml = null;
        const stylesRaw = zip.file('xl/styles.xml');
        if (stylesRaw) {
            try {
                let st = await stylesRaw.async('string');
                const nf0 = /<fonts\s+count="(\d+)"/.exec(st);
                const nfill0 = /<fills\s+count="(\d+)"/.exec(st);
                const nb0 = /<borders\s+count="(\d+)"/.exec(st);
                const nx0 = /<cellXfs\s+count="(\d+)"/.exec(st);
                if (nf0 && nfill0 && nb0 && nx0) {
                    const nf = parseInt(nf0[1], 10);
                    const nfill = parseInt(nfill0[1], 10);
                    const nb = parseInt(nb0[1], 10);
                    const nx = parseInt(nx0[1], 10);

                    const fontBold = '<font><b/><sz val="11"/><color theme="1"/><name val="Calibri"/><family val="2"/><scheme val="minor"/></font>';
                    const fontLink = '<font><u/><sz val="11"/><color rgb="FF0563C1"/><name val="Calibri"/><family val="2"/><scheme val="minor"/></font>';
                    const fillHeader = '<fill><patternFill patternType="solid"><fgColor rgb="FF4F81BD"/><bgColor indexed="64"/></patternFill></fill>';
                    const borderThin = '<border><left style="thin"><color rgb="FFD9D9D9"/></left><right style="thin"><color rgb="FFD9D9D9"/></right><top style="thin"><color rgb="FFD9D9D9"/></top><bottom style="thin"><color rgb="FFD9D9D9"/></bottom><diagonal/></border>';
                    const xfHeader = '<xf numFmtId="0" fontId="' + nf + '" fillId="' + nfill + '" borderId="' + nb + '" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>';
                    const xfCenter = '<xf numFmtId="0" fontId="0" fillId="0" borderId="' + nb + '" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>';
                    const xfLink = '<xf numFmtId="0" fontId="' + (nf + 1) + '" fillId="0" borderId="' + nb + '" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="left" vertical="center"/></xf>';

                    const upd = incTagCount(st, 'fonts', 2);
                    const upd2 = upd && incTagCount(upd, 'fills', 1);
                    const upd3 = upd2 && incTagCount(upd2, 'borders', 1);
                    const upd4 = upd3 && incTagCount(upd3, 'cellXfs', 3);
                    if (upd4 && upd4.indexOf('</fonts>') >= 0 && upd4.indexOf('</fills>') >= 0 && upd4.indexOf('</borders>') >= 0 && upd4.indexOf('</cellXfs>') >= 0) {
                        st = upd4
                            .replace('</fonts>', fontBold + fontLink + '</fonts>')
                            .replace('</fills>', fillHeader + '</fills>')
                            .replace('</borders>', borderThin + '</borders>')
                            .replace('</cellXfs>', xfHeader + xfCenter + xfLink + '</cellXfs>');
                        S = { xh: nx, xc: nx + 1, xl: nx + 2 };
                        stylesXml = st;
                    }
                }
            } catch (e) { /* 样式注入失败则回落为无样式（全部 s="0"） */ }
        }

        // ── 生成目录 worksheet XML ──
        const rowCount = names.length;
        let rows = '<row r="1">' +
            '<c r="A1" s="' + S.xh + '" t="inlineStr"><is><t>序号</t></is></c>' +
            '<c r="B1" s="' + S.xh + '" t="inlineStr"><is><t>工作表名称</t></is></c></row>';
        for (let i = 0; i < names.length; i++) {
            const r = i + 2;
            const nm = names[i];
            rows += '<row r="' + r + '">' +
                '<c r="A' + r + '" s="' + S.xc + '" t="n"><v>' + (i + 1) + '</v></c>' +
                '<c r="B' + r + '" s="' + S.xl + '" t="str"><f>' + xmlEsc(buildFormula(nm)) + '</f><v>' + xmlEsc(nm) + '</v></c>' +
                '</row>';
        }
        const sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
            '<dimension ref="A1:B' + (rowCount + 1) + '"/>' +
            '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
            '<sheetFormatPr defaultRowHeight="15"/>' +
            '<cols><col min="1" max="1" width="10" customWidth="1"/><col min="2" max="2" width="36" customWidth="1"/></cols>' +
            '<sheetData>' + rows + '</sheetData>' +
            '<pageMargins left="0.7" right="0.7" top="0.75" bottom="0.75" header="0.3" footer="0.3"/>' +
            '</worksheet>';

        // ── workbook.xml：插入 <sheet>（放最前）+ 打开重算 ──
        const newSheetEl = '<sheet name="' + xmlEsc(tocName) + '" sheetId="' + (newSheetNum + 1) + '" r:id="' + newRid + '"/>';
        if (/<sheets>/.test(wbXml)) wbXml = wbXml.replace(/<sheets>/, '<sheets>' + newSheetEl);
        else wbXml = wbXml.replace(/<\/sheets>/, newSheetEl + '</sheets>');
        if (/<calcPr/.test(wbXml)) {
            wbXml = wbXml.replace(/<calcPr([^>]*?)\/?>/, function (all, attrs) {
                return attrs.indexOf('fullCalcOnLoad') >= 0 ? all : '<calcPr' + attrs + ' fullCalcOnLoad="1"/>';
            });
        } else {
            wbXml = wbXml.replace(/<\/workbook>/, '<calcPr fullCalcOnLoad="1"/></workbook>');
        }

        // ── rels：追加关系 ──
        relsXml = relsXml.replace(/<\/Relationships>/, '<Relationship Id="' + newRid + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + newSheetNum + '.xml"/></Relationships>');

        // ── Content_Types：追加 Override ──
        ctXml = ctXml.replace(/<\/Types>/, '<Override PartName="/' + newSheetPath + '" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>');

        // ── 写回 ──
        zip.file('xl/workbook.xml', wbXml);
        zip.file('xl/_rels/workbook.xml.rels', relsXml);
        zip.file('[Content_Types].xml', ctXml);
        if (stylesXml) zip.file('xl/styles.xml', stylesXml);
        zip.file(newSheetPath, sheetXml);

        const out = await zip.generateAsync({ type: 'arraybuffer', compression: 'DEFLATE' });
        return { buffer: out, sheetCount: names.length, removed: removed, plain: !stylesXml };
    }

    btnGen.addEventListener('click', generateToc);

    // ═══════════════════════════════════════════════
    //  下载结果
    // ═══════════════════════════════════════════════
    btnDownload.addEventListener('click', () => {
        if (!resultBuf) {
            alert('没有可下载的结果，请先生成目录。');
            return;
        }

        try {
            // 注入后的字节原样下载，绝不经过二次序列化
            const blob = new Blob([resultBuf], {
                type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            });

            const baseName = selectedFile.name.replace(/\.[^.]+$/, '');
            const downloadName = baseName + '_带目录.' + resultExt;

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = downloadName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            log('💾 已下载：' + downloadName, 'success');
            setStatus('已下载：' + downloadName);
        } catch (err) {
            log('❌ 下载失败：' + err.message, 'error');
        }
    });

    // ═══════════════════════════════════════════════
    //  重置
    // ═══════════════════════════════════════════════
    btnReset.addEventListener('click', clearFile);

    // ═══════════════════════════════════════════════
    //  初始化
    // ═══════════════════════════════════════════════
    loadSettings();
    setStatus('就绪');
})();
</script>

</body>
</html>
